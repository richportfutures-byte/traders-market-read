    - autonomous_classification_beyond_registry_class
rule_structure:
  type: calibrated_evidence_state_machine
  description: P19-hardened state logic with concept-specific labels, class-preserving refusal behavior, and no
    universal thresholds or executional output.
  rules:
  - id: R1_magnetism
    logic: Emit LEVEL_MAGNETISM_CONTEXT when price behavior shows calibrated drift toward an untested reference,
      poor extreme, or other declared auction magnet.
  - id: R2_front_run
    logic: Emit LEVEL_FRONT_RUN_CONTEXT when reaction begins ahead of the reference inside the calibrated proximity
      window.
  - id: R3_overshoot
    logic: Emit LEVEL_OVERSHOOT_CONTEXT when price briefly breaches the level and reacts without accepted activity
      beyond it.
  - id: R4_decay
    logic: Emit LEVEL_DECAY_EVIDENCE when repeated tests show calibrated weakening in reaction quality.
  - id: R5_strengthening
    logic: Emit LEVEL_STRENGTHENED_AFTER_REJECTION when a clean rejection improves next-test credibility; missing
      test history emits TEST_HISTORY_REQUIRED.
  determinism_note: Registry and matrix class is CALIBRATED. Later work must not promote this spec beyond that class
    without governance review.
decision_logic:
  summary: P19-hardened evaluation for Level Magnetism & Decay using concept-specific states, feed-explicit evidence,
    class-preserving calibration/refusal behavior, and non-executional outputs.
  steps:
  - Validate the structural level, prior test history, price sequence, and feed health.
  - Classify magnetism, front-run, overshoot, decay, or strengthening from calibrated proximity, test, and reaction-quality
    features.
  - Use volume and prior test history to refine confidence only; missing history blocks decay claims.
  - Preserve stop-cluster language as inferred context, not direct observation.
  - Emit level-relevance states only and never predict that a level must break.
  output_boundary: Outputs are read-quality, evidence, context, confidence, review, or refusal labels only.
