spec_id: ch05_impulse_vs_grind
concept_id: ch05_impulse_vs_grind
concept_name: Impulse vs. Grind
display_name: Impulse vs. Grind
glossary_ref: glossary/chapter_05_momentum_follow_through_day_types.md#impulse-vs-grind
chapter:
  chapter_number: 5
  chapter_title: Momentum, Follow-Through & Day Types
  glossary_path: glossary/chapter_05_momentum_follow_through_day_types.md
determinism_class: CALIBRATED
semantic_source:
  glossary_path: glossary/chapter_05_momentum_follow_through_day_types.md
  concept_heading: Impulse vs. Grind
  doctrine_summary: '**Impulse vs. Grind** separates the texture of movement from the direction of movement. An impulse move
    is fast, forceful, and visibly displacing price. A grinding move is slower, more persistent, and often advances through
    repeated small pushes rather than one clean burst. A drive higher or lower can be either impulsive or grinding. A vertical
    or parabolic move is a more extreme form of impulse, often marked by urgency, forced participation, poor late location,
    or a book that cannot replenish fast enough. The shallow interpretation is that fast movement is automatically stronger
    and slow movement is automatically weak. That is wrong. A...'
purpose: Classify bounded Impulse vs. Grind states using a calibrated rule structure with all empirical values deferred to
  later calibration artifacts.
description: P16 Wave 3 detection-spec contract for Impulse vs. Grind. Fixed rule structure with named parameters. Values
  remain null until calibrated per instrument, session, timeframe, and regime.
non_executional_boundary: This spec emits semantic market-read, evidence, context, confidence, and refusal labels only. It
  never emits trade permission, entry, exit, stop, target, position sizing, add/reduce, broker, order, account, fill, P&L,
  or autonomous trading instructions.
required_inputs:
- name: price_bars
  source: market_data
  granularity: intraday
  session_dependency: Movement speed, displacement, overlap, and pullbacks.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: volume
  source: volume_feed
  granularity: intraday
  session_dependency: Participation behind movement.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: session_context
  source: session_context_module
  granularity: session
  session_dependency: Session/timeframe scope for texture comparison.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: tape_or_delta
  source: order_flow_module
  granularity: tick_or_intraday
  purpose: Supports sponsorship versus thin travel.
  absence_behavior: DEGRADED_CONFIDENCE
- name: value_behavior
  source: value_area_module
  granularity: profile
  purpose: Shows whether movement is accepted.
  absence_behavior: DEGRADED_CONFIDENCE
- name: spread_depth_context
  source: quote_or_depth_feed
  granularity: intraday
  purpose: Separates impulse from air-pocket travel.
  absence_behavior: DEGRADED_CONFIDENCE
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: DEGRADED_CONFIDENCE
  missing_calibration_parameters: INSUFFICIENT_EVIDENCE
  feed_blocked_condition: REFUSE_TO_CLASSIFY
  data_quality_failure: INSUFFICIENT_EVIDENCE
refusal_behavior:
  missing_required_feed: REFUSE_TO_CLASSIFY
  missing_calibration: INSUFFICIENT_EVIDENCE
  conflicting_evidence: REVIEW_REQUIRED
  missing_specialized_feed: DEGRADED_CONFIDENCE
detection_scope:
  allowed_to_classify:
  - Bounded evidence states for Impulse vs. Grind.
  - Confidence, downgrade, context, and refusal states tied to declared feeds.
  - Structural or evidence labels only, according to the determinism class.
  not_allowed_to_classify:
  - Trade permission or any execution instruction.
  - Entry, exit, stop, target, sizing, add/reduce, broker, order, account, fill, or P&L behavior.
  - Autonomous direction, setup approval, or guaranteed signal language.
  - Movement texture is not direction proof; speed and persistence require acceptance and sponsorship context.
  instrument_scope: Single instrument unless a future spec explicitly composes multiple registry concepts.
  session_scope: Scoped by the session definitions declared in required_inputs.
  timeframe_scope: Scoped by the supplied timeframe or profile/session period.
  regime_scope: Calibration and confidence are regime-aware; no universal thresholds are permitted.
evidence_model:
  evidence_categories:
  - name: primary_structure_or_feed
    observations:
    - IMPULSE_MOVE
    - GRIND_MOVE
    derivation: Primary feed evidence listed in required_inputs for Impulse vs. Grind.
  - name: confirmation_or_context
    observations:
    - CONFIRMATION_REQUIRED
    - REVIEW_REQUIRED
    - DEGRADED_CONFIDENCE
    derivation: Optional feeds and context either strengthen, downgrade, or require manual review.
  - name: refusal_and_feed_quality
    observations:
    - INSUFFICIENT_EVIDENCE
    - REFUSE_TO_CLASSIFY
    - BLOCKED_BY_FEEDS
    derivation: Missing required feeds, missing calibration, stale data, or feed-blocked conditions.
  evidence_hierarchy: Required inputs define the narrow Impulse vs. Grind state. Optional inputs can improve confidence but
    cannot create executional output or substitute for missing required feeds.
  evidence_states:
    supported:
    - IMPULSE_MOVE
    - GRIND_MOVE
    - VERTICAL_OR_PARABOLIC_MOVE
    - DRIFT_NOT_GRIND
    unsupported:
    - Any autonomous trade call from this concept.
    - Any deterministic claim beyond the registry determinism class.
    - Any proxy classification when a required feed is missing.
rule_structure:
  type: calibrated_movement_texture_classifier
  description: Fixed rule structure with named parameters. Values remain null until calibrated per instrument, session, timeframe,
    and regime.
  states:
  - IMPULSE_MOVE: Bounded Impulse vs. Grind label emitted only when evidence supports this state.
  - GRIND_MOVE: Bounded Impulse vs. Grind label emitted only when evidence supports this state.
  - VERTICAL_OR_PARABOLIC_MOVE: Bounded Impulse vs. Grind label emitted only when evidence supports this state.
  - DRIFT_NOT_GRIND: Bounded Impulse vs. Grind label emitted only when evidence supports this state.
  - TEXTURE_PENDING: Bounded Impulse vs. Grind label emitted only when evidence supports this state.
  - TEXTURE_REVIEW_REQUIRED: Bounded Impulse vs. Grind label emitted only when evidence supports this state.
  - DEGRADED_CONFIDENCE: Bounded Impulse vs. Grind label emitted only when evidence supports this state.
  - INSUFFICIENT_EVIDENCE: Bounded Impulse vs. Grind label emitted only when evidence supports this state.
  - REFUSE_TO_CLASSIFY: Bounded Impulse vs. Grind label emitted only when evidence supports this state.
  rules:
  - id: R1_impulse_move
    logic: Emit IMPULSE_MOVE only when declared evidence for Impulse vs. Grind supports that bounded state and required feeds
      are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R2_grind_move
    logic: Emit GRIND_MOVE only when declared evidence for Impulse vs. Grind supports that bounded state and required feeds
      are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R3_vertical_or_parabolic_move
    logic: Emit VERTICAL_OR_PARABOLIC_MOVE only when declared evidence for Impulse vs. Grind supports that bounded state and
      required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R4_drift_not_grind
    logic: Emit DRIFT_NOT_GRIND only when declared evidence for Impulse vs. Grind supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R5_texture_pending
    logic: Emit TEXTURE_PENDING only when declared evidence for Impulse vs. Grind supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R_refusal
    logic: Emit INSUFFICIENT_EVIDENCE or REFUSE_TO_CLASSIFY when required feeds, calibration, session scope, or data quality
      are missing. Do not substitute proxy data for unavailable required evidence.
  determinism_note: Impulse vs. Grind is classified as CALIBRATED; rule behavior must stay inside that class and avoid false
    determinism.
decision_logic:
  summary: Evaluate required feeds for Impulse vs. Grind, apply the class-appropriate rule structure, add optional evidence
    only as confirmation or downgrade context, and refuse when the evidence is missing or outside scope.
  boundary: Movement texture is not direction proof; speed and persistence require acceptance and sponsorship context.
  missing_feed_priority: Refusal or downgrade is preferred over inferred classification.
