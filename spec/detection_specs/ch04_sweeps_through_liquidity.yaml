spec_id: ch04_sweeps_through_liquidity
concept_id: ch04_sweeps_through_liquidity
concept_name: Sweeps Through Liquidity
display_name: Sweeps Through Liquidity
glossary_ref: glossary/chapter_04_tape_reading_microstructure.md#sweeps-through-liquidity
chapter:
  chapter_number: 4
  chapter_title: Tape Reading & Microstructure
  glossary_path: glossary/chapter_04_tape_reading_microstructure.md
determinism_class: CALIBRATED
semantic_source:
  glossary_path: glossary/chapter_04_tape_reading_microstructure.md
  concept_heading: Sweeps Through Liquidity
  doctrine_summary: 'A **sweep** is an aggressive order that takes out multiple price levels of resting liquidity in one motion,
    often deliberately targeting clustered stops. The sweep itself is direction-neutral and tells you almost nothing; the
    entire read lives in what happens immediately after. **Absorption after a sweep**, where the sweep is met by passive size
    and reverses, marks stop-run or failed-break evidence. **No absorption after a sweep**, where the sweep keeps traveling
    and begins to accept, marks stronger initiative or real-break evidence. This is the source document''s central demand
    made concrete: a stop run and a real breakout can look...'
purpose: Classify bounded Sweeps Through Liquidity states using a calibrated rule structure with all empirical values deferred
  to later calibration artifacts.
description: P16 Wave 3 detection-spec contract for Sweeps Through Liquidity. Fixed rule structure with named parameters.
  Values remain null until calibrated per instrument, session, timeframe, and regime.
non_executional_boundary: This spec emits semantic market-read, evidence, context, confidence, and refusal labels only. It
  never emits trade permission, entry, exit, stop, target, position sizing, add/reduce, broker, order, account, fill, P&L,
  or autonomous trading instructions.
required_inputs:
- name: price_sequence
  source: market_data
  granularity: tick_or_intraday
  session_dependency: Sweep and post-sweep path.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: structural_levels
  source: structural_reference_module
  granularity: price_references
  session_dependency: Known liquidity references being swept.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: session_clock
  source: calendar/session_definition_module
  granularity: session
  session_dependency: Calibration and observation scope.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: tick_data
  source: time_and_sales
  granularity: tick
  purpose: Improves multi-level take identification.
  absence_behavior: DEGRADED_CONFIDENCE
- name: cumulative_delta
  source: order_flow_module
  granularity: tick_or_intraday
  purpose: Supports post-sweep resolution.
  absence_behavior: DEGRADED_CONFIDENCE
- name: depth_feed
  source: depth_feed
  granularity: multi_level_depth
  purpose: Best evidence of swept resting liquidity.
  absence_behavior: DEGRADED_CONFIDENCE
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: DEGRADED_CONFIDENCE
  missing_calibration_parameters: INSUFFICIENT_EVIDENCE
  feed_blocked_condition: REFUSE_TO_CLASSIFY
  data_quality_failure: INSUFFICIENT_EVIDENCE
refusal_behavior:
  missing_required_feed: REFUSE_TO_CLASSIFY
  missing_calibration: INSUFFICIENT_EVIDENCE
  conflicting_evidence: REVIEW_REQUIRED
  missing_specialized_feed: DEGRADED_CONFIDENCE
detection_scope:
  allowed_to_classify:
  - Bounded evidence states for Sweeps Through Liquidity.
  - Confidence, downgrade, context, and refusal states tied to declared feeds.
  - Structural or evidence labels only, according to the determinism class.
  not_allowed_to_classify:
  - Trade permission or any execution instruction.
  - Entry, exit, stop, target, sizing, add/reduce, broker, order, account, fill, or P&L behavior.
  - Autonomous direction, setup approval, or guaranteed signal language.
  - The sweep is direction-neutral; only post-sweep resolution is labeled.
  instrument_scope: Single instrument unless a future spec explicitly composes multiple registry concepts.
  session_scope: Scoped by the session definitions declared in required_inputs.
  timeframe_scope: Scoped by the supplied timeframe or profile/session period.
  regime_scope: Calibration and confidence are regime-aware; no universal thresholds are permitted.
evidence_model:
  evidence_categories:
  - name: primary_structure_or_feed
    observations:
    - SWEEP_DETECTED
    - POST_SWEEP_ABSORPTION
    derivation: Primary feed evidence listed in required_inputs for Sweeps Through Liquidity.
  - name: confirmation_or_context
    observations:
    - CONFIRMATION_REQUIRED
    - REVIEW_REQUIRED
    - DEGRADED_CONFIDENCE
    derivation: Optional feeds and context either strengthen, downgrade, or require manual review.
  - name: refusal_and_feed_quality
    observations:
    - INSUFFICIENT_EVIDENCE
    - REFUSE_TO_CLASSIFY
    - BLOCKED_BY_FEEDS
    derivation: Missing required feeds, missing calibration, stale data, or feed-blocked conditions.
  evidence_hierarchy: Required inputs define the narrow Sweeps Through Liquidity state. Optional inputs can improve confidence
    but cannot create executional output or substitute for missing required feeds.
  evidence_states:
    supported:
    - SWEEP_DETECTED
    - POST_SWEEP_ABSORPTION
    - POST_SWEEP_CONTINUATION
    - SWEEP_RESOLUTION_PENDING
    unsupported:
    - Any autonomous trade call from this concept.
    - Any deterministic claim beyond the registry determinism class.
    - Any proxy classification when a required feed is missing.
rule_structure:
  type: calibrated_sweep_resolution_classifier
  description: Fixed rule structure with named parameters. Values remain null until calibrated per instrument, session, timeframe,
    and regime.
  states:
  - SWEEP_DETECTED: Bounded Sweeps Through Liquidity label emitted only when evidence supports this state.
  - POST_SWEEP_ABSORPTION: Bounded Sweeps Through Liquidity label emitted only when evidence supports this state.
  - POST_SWEEP_CONTINUATION: Bounded Sweeps Through Liquidity label emitted only when evidence supports this state.
  - SWEEP_RESOLUTION_PENDING: Bounded Sweeps Through Liquidity label emitted only when evidence supports this state.
  - COARSE_PRICE_SPIKE_CONTEXT: Bounded Sweeps Through Liquidity label emitted only when evidence supports this state.
  - DEGRADED_CONFIDENCE: Bounded Sweeps Through Liquidity label emitted only when evidence supports this state.
  - INSUFFICIENT_EVIDENCE: Bounded Sweeps Through Liquidity label emitted only when evidence supports this state.
  - REFUSE_TO_CLASSIFY: Bounded Sweeps Through Liquidity label emitted only when evidence supports this state.
  rules:
  - id: R1_sweep_detected
    logic: Emit SWEEP_DETECTED only when declared evidence for Sweeps Through Liquidity supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R2_post_sweep_absorption
    logic: Emit POST_SWEEP_ABSORPTION only when declared evidence for Sweeps Through Liquidity supports that bounded state
      and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R3_post_sweep_continuation
    logic: Emit POST_SWEEP_CONTINUATION only when declared evidence for Sweeps Through Liquidity supports that bounded state
      and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R4_sweep_resolution_pending
    logic: Emit SWEEP_RESOLUTION_PENDING only when declared evidence for Sweeps Through Liquidity supports that bounded state
      and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R5_coarse_price_spike_context
    logic: Emit COARSE_PRICE_SPIKE_CONTEXT only when declared evidence for Sweeps Through Liquidity supports that bounded
      state and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R_refusal
    logic: Emit INSUFFICIENT_EVIDENCE or REFUSE_TO_CLASSIFY when required feeds, calibration, session scope, or data quality
      are missing. Do not substitute proxy data for unavailable required evidence.
  determinism_note: Sweeps Through Liquidity is classified as CALIBRATED; rule behavior must stay inside that class and avoid
    false determinism.
decision_logic:
  summary: Evaluate required feeds for Sweeps Through Liquidity, apply the class-appropriate rule structure, add optional
    evidence only as confirmation or downgrade context, and refuse when the evidence is missing or outside scope.
  boundary: The sweep is direction-neutral; only post-sweep resolution is labeled.
  missing_feed_priority: Refusal or downgrade is preferred over inferred classification.
