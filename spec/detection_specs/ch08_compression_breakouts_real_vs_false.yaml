    unsupported:
    - trade_signal
    - execution_permission
    - universal_threshold_claim
    - missing_feed_proxy
    - autonomous_classification_beyond_registry_class
rule_structure:
  type: calibrated_evidence_state_machine
  description: State logic follows the registry determinism class. Calibrated rules name parameters without values;
    judgment-assisted rules preserve review hooks; context-only and feed-blocked rules refuse or downgrade rather
    than over-detect.
  rules:
  - id: R1_context
    logic: Emit COMPRESSION_BREAKOUTS_REAL_VS_FALSE_CONTEXT when required feeds support the structural context for
      Compression Breakouts (Real vs. False) but calibrated confirmation is not complete.
  - id: R2_confirmed
    logic: Emit COMPRESSION_BREAKOUTS_REAL_VS_FALSE_CONFIRMED only when the named calibrated requirements are available
      and satisfied for the instrument/session/timeframe/regime.
  - id: R3_not_confirmed
    logic: Emit COMPRESSION_BREAKOUTS_REAL_VS_FALSE_NOT_CONFIRMED when required feeds are valid but calibrated evidence
      does not support the concept.
  - id: R4_review
    logic: Emit COMPRESSION_BREAKOUTS_REAL_VS_FALSE_REVIEW_REQUIRED when evidence families conflict or optional
      evidence changes the read quality.
  - id: R5_no_calibration
    logic: Emit CALIBRATION_REQUIRED or INSUFFICIENT_EVIDENCE when parameter values have not been supplied by a
      later calibration artifact.
  determinism_note: Registry and matrix class is CALIBRATED. Later work must not promote this spec beyond that class
    without governance review.
decision_logic:
  summary: Evaluate Compression Breakouts (Real vs. False) using declared feeds, class-safe state logic, missing-feed
    behavior, and non-executional output boundaries.
  steps:
  - Validate required feeds, session definitions, and data freshness.
  - Collect the declared structural, contextual, and quality evidence for the concept.
  - Apply the class-appropriate rule structure with all calibration values unset until later calibration artifacts
    provide them.
  - Use optional inputs only to strengthen, weaken, or downgrade confidence; never assume missing evidence exists.
  - Emit bounded evidence, context, confidence, review, or refusal labels only.
  output_boundary: Outputs are read-quality, evidence, context, confidence, review, or refusal labels only.
