  - COMPRESSION_BREAKOUTS_REAL_VS_FALSE_CONTEXT
  - COMPRESSION_BREAKOUTS_REAL_VS_FALSE_CONFIRMED
  - COMPRESSION_BREAKOUTS_REAL_VS_FALSE_NOT_CONFIRMED
