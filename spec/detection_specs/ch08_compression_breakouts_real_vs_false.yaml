rule_structure:
  type: calibrated_evidence_state_machine
  description: P19-hardened state logic with concept-specific labels, class-preserving refusal behavior, and no
    universal thresholds or executional output.
  rules:
  - id: R1_pending
    logic: Emit COMPRESSION_BREAK_PENDING when price first leaves the compressed range before acceptance, follow-through,
      or failure evidence is available.
  - id: R2_accepted_break
    logic: Emit ACCEPTED_COMPRESSION_BREAK when calibrated hold, dwell/activity, value migration, and follow-through
      evidence support accepted release.
  - id: R3_false_break
    logic: Emit FALSE_COMPRESSION_BREAK when price reclaims the compression boundary and cannot build activity outside
      the range.
  - id: R4_stop_run_context
    logic: Emit STOP_RUN_CONTEXT_UNCONFIRMED only as inferred context when a boundary sweep reclaims; do not claim
      stop activation without specialized feeds.
  - id: R5_anticipation
    logic: Emit BREAKOUT_ANTICIPATION_CONTEXT when movement drifts toward or through the boundary before confirmation;
      missing profile/tape emits PROFILE_OR_TAPE_REQUIRED.
  determinism_note: Registry and matrix class is CALIBRATED. Later work must not promote this spec beyond that class
    without governance review.
decision_logic:
  summary: P19-hardened evaluation for Compression Breakouts (Real vs. False) using concept-specific states, feed-explicit
    evidence, class-preserving calibration/refusal behavior, and non-executional outputs.
  steps:
  - Validate compressed range boundaries, session clock, price bars, and feed health.
  - Treat first print outside compression as pending rather than the verdict.
  - Evaluate acceptance, follow-through, value migration, reclaim, and first-pause behavior with calibrated parameters.
  - Use profile/tape inputs for sponsorship and stop-run quality only when present.
  - Emit release/failure states only; never emit breakout direction or permission.
  output_boundary: Outputs are read-quality, evidence, context, confidence, review, or refusal labels only.
