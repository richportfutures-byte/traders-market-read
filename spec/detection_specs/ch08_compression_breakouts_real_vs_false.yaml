  session_scope: Configured session definitions and source chapter context only.
  timeframe_scope: Configured timeframe, event window, or review window only.
  regime_scope: Calibration and interpretation must be scoped by instrument, session, timeframe, and regime when
    the registry class requires it.
evidence_model:
  evidence_categories:
  - name: required_evidence_set
    observations:
    - price_bars
    - structural_range
    - session_clock
    - feed_quality_and_scope_status
    derivation: All required observations must be present, fresh, synchronized, and in scope before the spec emits
      any non-refusal label.
  - name: optional_confirmation_or_downgrade_set
    observations:
    - volume_profile
    - tape
    - event_calendar
    derivation: Optional observations can strengthen, weaken, or downgrade confidence but cannot be assumed or proxied.
  - name: class_boundary
    observations:
    - CALIBRATED
    - volatility_regime_context
    derivation: The registry determinism class controls whether the output is structural, calibrated, judgment-assisted,
      context-only, or feed-blocked.
  evidence_hierarchy: Required feeds establish the narrow state. Optional feeds adjust confidence and review status.
    The determinism class prevents false promotion into a stronger detector.
  evidence_states:
