confidence_behavior:
  full_confidence: All required feeds are present, fresh, scoped correctly, and the class-appropriate evidence conditions
    are satisfied.
  degraded_confidence_triggers:
  - Optional feeds are unavailable or stale.
  - Evidence is late, conflicted, thin, poorly located, event-distorted, or outside the calibrated scope.
  - The concept requires judgment that available machine evidence can only assist, not finalize.
  review_required_trigger: Evidence supports more than context but remains mixed enough that human or later model
    review is required.
  no_binary_certainty_claim: No label asserts certain truth, direction, trade quality, or execution permission.
confidence_rules:
  full_confidence_requires:
  - price_bars
  - structural_range
  - session_clock
  - feed_quality_and_scope_status
  downgrade_when:
  - Optional confirmation feeds are absent.
  - Calibration is required but unavailable or stale.
  - Required feeds support only structure, not participant intent or thesis quality.
  - Evidence conflicts across structural, tape, catalyst, intermarket, volatility, thesis, or setup-quality layers.
  refuse_when:
  - Required feeds are missing, stale, malformed, or out of scope.
  - The requested output requires unavailable external feeds or direct participant intent.
  - The caller asks for executional behavior or autonomous trade output.
refusal_conditions:
- A required feed is missing, stale, malformed, or not synchronized.
- Session, instrument, timeframe, event-window, or regime scope is undefined.
- Calibration is required but no later calibration artifact supplies values.
- The requested classification would require evidence not available in current feeds.
- The requested output would imply trade permission, entry, exit, stop, target, sizing, broker/order/account/fill/P&L
  behavior, or autonomous action.
