spec_id: ch02_polarity_flip
concept_id: ch02_polarity_flip
concept_name: Polarity Flip
display_name: Polarity Flip
glossary_ref: glossary/chapter_02_level_interaction_acceptance.md#polarity-flip
chapter:
  chapter_number: 2
  chapter_title: Level Interaction & Acceptance
  glossary_path: glossary/chapter_02_level_interaction_acceptance.md
determinism_class: CALIBRATED
semantic_source:
  glossary_path: glossary/chapter_02_level_interaction_acceptance.md
  concept_heading: Polarity Flip
  doctrine_summary: "When a level is genuinely broken and accepted, its role inverts \u2014 **prior resistance becomes support**,\
    \ **prior support becomes resistance**. This is the **polarity flip** (S/R flip), one of the most reliable structural\
    \ behaviors in markets. A support level breaks, price falls, and on the way back up that old support now caps price as\
    \ resistance \u2014 and the mirror for resistance becoming support. A **reclaim of a prior breakdown level** is price\
    \ recovering back above a level it had broken down through, invalidating the breakdown and trapping the shorts. A **loss\
    \ of a prior breakout level** is price falling back below a level it had broken..."
purpose: Classify bounded Polarity Flip states using a calibrated rule structure with all empirical values deferred to later
  calibration artifacts.
description: P16 Wave 3 detection-spec contract for Polarity Flip. Fixed rule structure with named parameters. Values remain
  null until calibrated per instrument, session, timeframe, and regime.
non_executional_boundary: This spec emits semantic market-read, evidence, context, confidence, and refusal labels only. It
  never emits trade permission, entry, exit, stop, target, position sizing, add/reduce, broker, order, account, fill, P&L,
  or autonomous trading instructions.
required_inputs:
- name: broken_structural_level
  source: structural_reference_module
  granularity: price
  session_dependency: Prior support or resistance that was broken.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: post_break_price_sequence
  source: market_data
  granularity: tick_or_intraday
  session_dependency: Return to level and retest behavior.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: session_clock
  source: calendar/session_definition_module
  granularity: session
  session_dependency: Retest-window calibration scope.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: volume_at_retest
  source: volume_or_profile_module
  granularity: per_price
  purpose: Supports quality of the retest response.
  absence_behavior: DEGRADED_CONFIDENCE
- name: tape_or_delta
  source: order_flow_module
  granularity: tick_or_intraday
  purpose: Confirms or contradicts retest behavior.
  absence_behavior: DEGRADED_CONFIDENCE
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: DEGRADED_CONFIDENCE
  missing_calibration_parameters: INSUFFICIENT_EVIDENCE
  feed_blocked_condition: REFUSE_TO_CLASSIFY
  data_quality_failure: INSUFFICIENT_EVIDENCE
refusal_behavior:
  missing_required_feed: REFUSE_TO_CLASSIFY
  missing_calibration: INSUFFICIENT_EVIDENCE
  conflicting_evidence: REVIEW_REQUIRED
  missing_specialized_feed: DEGRADED_CONFIDENCE
detection_scope:
  allowed_to_classify:
  - Bounded evidence states for Polarity Flip.
  - Confidence, downgrade, context, and refusal states tied to declared feeds.
  - Structural or evidence labels only, according to the determinism class.
  not_allowed_to_classify:
  - Trade permission or any execution instruction.
  - Entry, exit, stop, target, sizing, add/reduce, broker, order, account, fill, or P&L behavior.
  - Autonomous direction, setup approval, or guaranteed signal language.
  - Flip labels describe changed level behavior; trapped-positioning consequences belong to Chapter 6.
  instrument_scope: Single instrument unless a future spec explicitly composes multiple registry concepts.
  session_scope: Scoped by the session definitions declared in required_inputs.
  timeframe_scope: Scoped by the supplied timeframe or profile/session period.
  regime_scope: Calibration and confidence are regime-aware; no universal thresholds are permitted.
evidence_model:
  evidence_categories:
  - name: primary_structure_or_feed
    observations:
    - RETEST_PENDING
    - POLARITY_FLIP_CONFIRMED
    derivation: Primary feed evidence listed in required_inputs for Polarity Flip.
  - name: confirmation_or_context
    observations:
    - CONFIRMATION_REQUIRED
    - REVIEW_REQUIRED
    - DEGRADED_CONFIDENCE
    derivation: Optional feeds and context either strengthen, downgrade, or require manual review.
  - name: refusal_and_feed_quality
    observations:
    - INSUFFICIENT_EVIDENCE
    - REFUSE_TO_CLASSIFY
    - BLOCKED_BY_FEEDS
    derivation: Missing required feeds, missing calibration, stale data, or feed-blocked conditions.
  evidence_hierarchy: Required inputs define the narrow Polarity Flip state. Optional inputs can improve confidence but cannot
    create executional output or substitute for missing required feeds.
  evidence_states:
    supported:
    - RETEST_PENDING
    - POLARITY_FLIP_CONFIRMED
    - POLARITY_FLIP_FAILED
    - RECLAIM_CONFIRMED
    unsupported:
    - Any autonomous trade call from this concept.
    - Any deterministic claim beyond the registry determinism class.
    - Any proxy classification when a required feed is missing.
rule_structure:
  type: calibrated_polarity_retest_state_machine
  description: Fixed rule structure with named parameters. Values remain null until calibrated per instrument, session, timeframe,
    and regime.
  states:
  - RETEST_PENDING: Bounded Polarity Flip label emitted only when evidence supports this state.
  - POLARITY_FLIP_CONFIRMED: Bounded Polarity Flip label emitted only when evidence supports this state.
  - POLARITY_FLIP_FAILED: Bounded Polarity Flip label emitted only when evidence supports this state.
  - RECLAIM_CONFIRMED: Bounded Polarity Flip label emitted only when evidence supports this state.
  - LOSS_CONFIRMED: Bounded Polarity Flip label emitted only when evidence supports this state.
  - STRUCTURAL_RETEST_ONLY: Bounded Polarity Flip label emitted only when evidence supports this state.
  - REVIEW_REQUIRED: Bounded Polarity Flip label emitted only when evidence supports this state.
  - DEGRADED_CONFIDENCE: Bounded Polarity Flip label emitted only when evidence supports this state.
  - INSUFFICIENT_EVIDENCE: Bounded Polarity Flip label emitted only when evidence supports this state.
  - REFUSE_TO_CLASSIFY: Bounded Polarity Flip label emitted only when evidence supports this state.
  rules:
  - id: R1_retest_pending
    logic: Emit RETEST_PENDING only when declared evidence for Polarity Flip supports that bounded state and required feeds
      are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R2_polarity_flip_confirmed
    logic: Emit POLARITY_FLIP_CONFIRMED only when declared evidence for Polarity Flip supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R3_polarity_flip_failed
    logic: Emit POLARITY_FLIP_FAILED only when declared evidence for Polarity Flip supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R4_reclaim_confirmed
    logic: Emit RECLAIM_CONFIRMED only when declared evidence for Polarity Flip supports that bounded state and required feeds
      are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R5_loss_confirmed
    logic: Emit LOSS_CONFIRMED only when declared evidence for Polarity Flip supports that bounded state and required feeds
      are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R_refusal
    logic: Emit INSUFFICIENT_EVIDENCE or REFUSE_TO_CLASSIFY when required feeds, calibration, session scope, or data quality
      are missing. Do not substitute proxy data for unavailable required evidence.
  determinism_note: Polarity Flip is classified as CALIBRATED; rule behavior must stay inside that class and avoid false determinism.
decision_logic:
  summary: Evaluate required feeds for Polarity Flip, apply the class-appropriate rule structure, add optional evidence only
    as confirmation or downgrade context, and refuse when the evidence is missing or outside scope.
  boundary: Flip labels describe changed level behavior; trapped-positioning consequences belong to Chapter 6.
  missing_feed_priority: Refusal or downgrade is preferred over inferred classification.
