spec_id: ch04_spread_behavior
concept_id: ch04_spread_behavior
concept_name: Spread Behavior
display_name: Spread Behavior
glossary_ref: glossary/chapter_04_tape_reading_microstructure.md#spread-behavior
chapter:
  chapter_number: 4
  chapter_title: Tape Reading & Microstructure
  glossary_path: glossary/chapter_04_tape_reading_microstructure.md
determinism_class: CALIBRATED
semantic_source:
  glossary_path: glossary/chapter_04_tape_reading_microstructure.md
  concept_heading: Spread Behavior
  doctrine_summary: "The **bid-ask spread** is a continuous, real-time liquidity gauge \u2014 and it should be read continuously,\
    \ not only noticed when it costs you a fill. **Widening** means market makers are pricing in risk, pulling depth, and\
    \ demanding more compensation to provide liquidity: a stress signal. **Normalizing** means liquidity is returning and\
    \ that risk is being repriced lower. The spread is simultaneously a *cost* (your transaction tax on every round trip)\
    \ and a *signal* (its width is what liquidity providers think about the next few seconds). Most traders treat it as the\
    \ former and ignore the latter, which is a mistake."
purpose: Classify bounded Spread Behavior states using a calibrated rule structure with all empirical values deferred to later
  calibration artifacts.
description: P16 Wave 3 detection-spec contract for Spread Behavior. Fixed rule structure with named parameters. Values remain
  null until calibrated per instrument, session, timeframe, and regime.
non_executional_boundary: This spec emits semantic market-read, evidence, context, confidence, and refusal labels only. It
  never emits trade permission, entry, exit, stop, target, position sizing, add/reduce, broker, order, account, fill, P&L,
  or autonomous trading instructions.
required_inputs:
- name: bid_ask_quotes
  source: quote_feed
  granularity: tick_or_intraday
  session_dependency: Inside bid/ask quote series.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: session_clock
  source: calendar/session_definition_module
  granularity: session
  session_dependency: Product/session baseline scope.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: depth_behind_inside
  source: depth_feed
  granularity: multi_level_depth
  purpose: Improves stability and liquidity reading.
  absence_behavior: DEGRADED_CONFIDENCE
- name: event_calendar
  source: calendar_or_catalyst_module
  granularity: event_window
  purpose: Identifies event-related widening context.
  absence_behavior: DEGRADED_CONFIDENCE
- name: realized_volatility
  source: volatility_statistics_module
  granularity: intraday
  purpose: Separates spread stress from normal volatility regime.
  absence_behavior: DEGRADED_CONFIDENCE
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: DEGRADED_CONFIDENCE
  missing_calibration_parameters: INSUFFICIENT_EVIDENCE
  feed_blocked_condition: REFUSE_TO_CLASSIFY
  data_quality_failure: INSUFFICIENT_EVIDENCE
refusal_behavior:
  missing_required_feed: REFUSE_TO_CLASSIFY
  missing_calibration: INSUFFICIENT_EVIDENCE
  conflicting_evidence: REVIEW_REQUIRED
  missing_specialized_feed: DEGRADED_CONFIDENCE
detection_scope:
  allowed_to_classify:
  - Bounded evidence states for Spread Behavior.
  - Confidence, downgrade, context, and refusal states tied to declared feeds.
  - Structural or evidence labels only, according to the determinism class.
  not_allowed_to_classify:
  - Trade permission or any execution instruction.
  - Entry, exit, stop, target, sizing, add/reduce, broker, order, account, fill, or P&L behavior.
  - Autonomous direction, setup approval, or guaranteed signal language.
  - Spread state is execution-environment evidence and never a direction or order instruction.
  instrument_scope: Single instrument unless a future spec explicitly composes multiple registry concepts.
  session_scope: Scoped by the session definitions declared in required_inputs.
  timeframe_scope: Scoped by the supplied timeframe or profile/session period.
  regime_scope: Calibration and confidence are regime-aware; no universal thresholds are permitted.
evidence_model:
  evidence_categories:
  - name: primary_structure_or_feed
    observations:
    - SPREAD_STABLE
    - SPREAD_WIDENING
    derivation: Primary feed evidence listed in required_inputs for Spread Behavior.
  - name: confirmation_or_context
    observations:
    - CONFIRMATION_REQUIRED
    - REVIEW_REQUIRED
    - DEGRADED_CONFIDENCE
    derivation: Optional feeds and context either strengthen, downgrade, or require manual review.
  - name: refusal_and_feed_quality
    observations:
    - INSUFFICIENT_EVIDENCE
    - REFUSE_TO_CLASSIFY
    - BLOCKED_BY_FEEDS
    derivation: Missing required feeds, missing calibration, stale data, or feed-blocked conditions.
  evidence_hierarchy: Required inputs define the narrow Spread Behavior state. Optional inputs can improve confidence but
    cannot create executional output or substitute for missing required feeds.
  evidence_states:
    supported:
    - SPREAD_STABLE
    - SPREAD_WIDENING
    - SPREAD_NORMALIZING
    - SPREAD_UNSTABLE
    unsupported:
    - Any autonomous trade call from this concept.
    - Any deterministic claim beyond the registry determinism class.
    - Any proxy classification when a required feed is missing.
rule_structure:
  type: calibrated_spread_state_classifier
  description: Fixed rule structure with named parameters. Values remain null until calibrated per instrument, session, timeframe,
    and regime.
  states:
  - SPREAD_STABLE: Bounded Spread Behavior label emitted only when evidence supports this state.
  - SPREAD_WIDENING: Bounded Spread Behavior label emitted only when evidence supports this state.
  - SPREAD_NORMALIZING: Bounded Spread Behavior label emitted only when evidence supports this state.
  - SPREAD_UNSTABLE: Bounded Spread Behavior label emitted only when evidence supports this state.
  - SPREAD_BLOCKED: Bounded Spread Behavior label emitted only when evidence supports this state.
  - EXECUTION_ENVIRONMENT_DEGRADED: Bounded Spread Behavior label emitted only when evidence supports this state.
  - DEGRADED_CONFIDENCE: Bounded Spread Behavior label emitted only when evidence supports this state.
  - INSUFFICIENT_EVIDENCE: Bounded Spread Behavior label emitted only when evidence supports this state.
  - REFUSE_TO_CLASSIFY: Bounded Spread Behavior label emitted only when evidence supports this state.
  rules:
  - id: R1_spread_stable
    logic: Emit SPREAD_STABLE only when declared evidence for Spread Behavior supports that bounded state and required feeds
      are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R2_spread_widening
    logic: Emit SPREAD_WIDENING only when declared evidence for Spread Behavior supports that bounded state and required feeds
      are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R3_spread_normalizing
    logic: Emit SPREAD_NORMALIZING only when declared evidence for Spread Behavior supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R4_spread_unstable
    logic: Emit SPREAD_UNSTABLE only when declared evidence for Spread Behavior supports that bounded state and required feeds
      are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R5_spread_blocked
    logic: Emit SPREAD_BLOCKED only when declared evidence for Spread Behavior supports that bounded state and required feeds
      are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R_refusal
    logic: Emit INSUFFICIENT_EVIDENCE or REFUSE_TO_CLASSIFY when required feeds, calibration, session scope, or data quality
      are missing. Do not substitute proxy data for unavailable required evidence.
  determinism_note: Spread Behavior is classified as CALIBRATED; rule behavior must stay inside that class and avoid false
    determinism.
decision_logic:
  summary: Evaluate required feeds for Spread Behavior, apply the class-appropriate rule structure, add optional evidence
    only as confirmation or downgrade context, and refuse when the evidence is missing or outside scope.
  boundary: Spread state is execution-environment evidence and never a direction or order instruction.
  missing_feed_priority: Refusal or downgrade is preferred over inferred classification.
