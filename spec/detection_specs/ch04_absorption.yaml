spec_id: ch04_absorption
concept_id: ch04_absorption
concept_name: Absorption
display_name: Absorption
glossary_ref: glossary/chapter_04_tape_reading_microstructure.md#absorption
chapter:
  chapter_number: 4
  chapter_title: Tape Reading & Microstructure
  glossary_path: glossary/chapter_04_tape_reading_microstructure.md
determinism_class: JUDGMENT_ASSISTED
semantic_source:
  glossary_path: glossary/chapter_04_tape_reading_microstructure.md
  concept_heading: Absorption
  doctrine_summary: "**Absorption** is passive liquidity soaking up aggressive market orders without price moving. When aggressive\
    \ buyers keep lifting offers but price refuses to advance, a large passive seller is sitting there \u2014 refilling the\
    \ offer faster than the tape can eat it. The tell is the *disconnect between effort and result*: high volume, real aggression,\
    \ no displacement. Absorption at resistance after a sweep is one of the cleanest reversal tells on the tape; absorption\
    \ with no follow-through is also how trends quietly die without a single bar of warning. Retail traders routinely misread\
    \ absorption as \"consolidation\" \u2014 it is not consolidation, it..."
purpose: Emit bounded evidence and review labels for Absorption while preserving human judgment and refusing unsupported deterministic
  conclusions.
description: P16 Wave 3 detection-spec contract for Absorption. Evidence tagging and confidence/downgrade logic only; final
  trader judgment remains outside the detector.
non_executional_boundary: This spec emits semantic market-read, evidence, context, confidence, and refusal labels only. It
  never emits trade permission, entry, exit, stop, target, position sizing, add/reduce, broker, order, account, fill, P&L,
  or autonomous trading instructions.
required_inputs:
- name: price_behavior_at_reference
  source: market_data
  granularity: tick_or_intraday
  session_dependency: Price result around the tested reference.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: aggression_or_delta_feed
  source: order_flow_module
  granularity: tick_or_footprint
  session_dependency: Aggressive effort evidence; absence blocks strong absorption claims.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: volume_or_time_at_price
  source: volume_profile_module
  granularity: per_price
  session_dependency: Evidence of effort meeting passive response.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: dom_or_refreshing_size
  source: depth_feed
  granularity: multi_level_depth
  purpose: Improves passive-size confirmation.
  absence_behavior: DEGRADED_CONFIDENCE
- name: structural_reference
  source: structural_reference_module
  granularity: price
  purpose: Location quality for the absorption read.
  absence_behavior: DEGRADED_CONFIDENCE
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: DEGRADED_CONFIDENCE
  missing_calibration_parameters: CONTEXT_ONLY
  feed_blocked_condition: REFUSE_TO_CLASSIFY
  data_quality_failure: INSUFFICIENT_EVIDENCE
refusal_behavior:
  missing_required_feed: REFUSE_TO_CLASSIFY
  missing_calibration: CONTEXT_ONLY
  conflicting_evidence: REVIEW_REQUIRED
  missing_specialized_feed: DEGRADED_CONFIDENCE
detection_scope:
  allowed_to_classify:
  - Bounded evidence states for Absorption.
  - Confidence, downgrade, context, and refusal states tied to declared feeds.
  - Structural or evidence labels only, according to the determinism class.
  not_allowed_to_classify:
  - Trade permission or any execution instruction.
  - Entry, exit, stop, target, sizing, add/reduce, broker, order, account, fill, or P&L behavior.
  - Autonomous direction, setup approval, or guaranteed signal language.
  - Absorption conclusion remains interpretive; the spec emits evidence labels, not a deterministic reversal.
  instrument_scope: Single instrument unless a future spec explicitly composes multiple registry concepts.
  session_scope: Scoped by the session definitions declared in required_inputs.
  timeframe_scope: Scoped by the supplied timeframe or profile/session period.
  regime_scope: Calibration and confidence are regime-aware; no universal thresholds are permitted.
evidence_model:
  evidence_categories:
  - name: primary_structure_or_feed
    observations:
    - EFFORT_WITHOUT_RESULT_OBSERVED
    - ABSORPTION_EVIDENCE_PRESENT
    derivation: Primary feed evidence listed in required_inputs for Absorption.
  - name: confirmation_or_context
    observations:
    - CONFIRMATION_REQUIRED
    - REVIEW_REQUIRED
    - DEGRADED_CONFIDENCE
    derivation: Optional feeds and context either strengthen, downgrade, or require manual review.
  - name: refusal_and_feed_quality
    observations:
    - INSUFFICIENT_EVIDENCE
    - REFUSE_TO_CLASSIFY
    - BLOCKED_BY_FEEDS
    derivation: Missing required feeds, missing calibration, stale data, or feed-blocked conditions.
  evidence_hierarchy: Required inputs define the narrow Absorption state. Optional inputs can improve confidence but cannot
    create executional output or substitute for missing required feeds.
  evidence_states:
    supported:
    - EFFORT_WITHOUT_RESULT_OBSERVED
    - ABSORPTION_EVIDENCE_PRESENT
    - ABSORPTION_REVIEW_REQUIRED
    - LOW_CONFIDENCE_STRUCTURAL_STALL
    unsupported:
    - Any autonomous trade call from this concept.
    - Any deterministic claim beyond the registry determinism class.
    - Any proxy classification when a required feed is missing.
rule_structure:
  type: judgment_assisted_absorption_evidence_model
  description: Evidence tagging and confidence/downgrade logic only; final trader judgment remains outside the detector.
  states:
  - EFFORT_WITHOUT_RESULT_OBSERVED: Bounded Absorption label emitted only when evidence supports this state.
  - ABSORPTION_EVIDENCE_PRESENT: Bounded Absorption label emitted only when evidence supports this state.
  - ABSORPTION_REVIEW_REQUIRED: Bounded Absorption label emitted only when evidence supports this state.
  - LOW_CONFIDENCE_STRUCTURAL_STALL: Bounded Absorption label emitted only when evidence supports this state.
  - NOT_DETECTABLE_WITH_CURRENT_FEEDS: Bounded Absorption label emitted only when evidence supports this state.
  - DEGRADED_CONFIDENCE: Bounded Absorption label emitted only when evidence supports this state.
  - INSUFFICIENT_EVIDENCE: Bounded Absorption label emitted only when evidence supports this state.
  - REFUSE_TO_CLASSIFY: Bounded Absorption label emitted only when evidence supports this state.
  rules:
  - id: R1_effort_without_result_observed
    logic: Emit EFFORT_WITHOUT_RESULT_OBSERVED only when declared evidence for Absorption supports that bounded state and
      required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R2_absorption_evidence_present
    logic: Emit ABSORPTION_EVIDENCE_PRESENT only when declared evidence for Absorption supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R3_absorption_review_required
    logic: Emit ABSORPTION_REVIEW_REQUIRED only when declared evidence for Absorption supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R4_low_confidence_structural_stall
    logic: Emit LOW_CONFIDENCE_STRUCTURAL_STALL only when declared evidence for Absorption supports that bounded state and
      required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R5_not_detectable_with_current_feeds
    logic: Emit NOT_DETECTABLE_WITH_CURRENT_FEEDS only when declared evidence for Absorption supports that bounded state and
      required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R_refusal
    logic: Emit INSUFFICIENT_EVIDENCE or REFUSE_TO_CLASSIFY when required feeds, calibration, session scope, or data quality
      are missing. Do not substitute proxy data for unavailable required evidence.
  determinism_note: Absorption is classified as JUDGMENT_ASSISTED; rule behavior must stay inside that class and avoid false
    determinism.
decision_logic:
  summary: Evaluate required feeds for Absorption, apply the class-appropriate rule structure, add optional evidence only
    as confirmation or downgrade context, and refuse when the evidence is missing or outside scope.
  boundary: Absorption conclusion remains interpretive; the spec emits evidence labels, not a deterministic reversal.
  missing_feed_priority: Refusal or downgrade is preferred over inferred classification.
calibration_parameters:
- name: effort_without_result_policy
  value: null
  status: calibration_required
  unit: configured
  calibration_scope: instrument_session_timeframe_regime
  description: effort_without_result_policy parameter; value must be supplied by later calibration or method configuration,
    not P16.
- name: delta_price_divergence_policy
  value: null
  status: calibration_required
  unit: configured
  calibration_scope: instrument_session_timeframe_regime
  description: delta_price_divergence_policy parameter; value must be supplied by later calibration or method configuration,
    not P16.
- name: time_at_price_requirement
  value: null
  status: calibration_required
  unit: configured
  calibration_scope: instrument_session_timeframe_regime
  description: time_at_price_requirement parameter; value must be supplied by later calibration or method configuration, not
    P16.
parameters:
- name: effort_without_result_policy
  value: null
  status: calibration_required
- name: delta_price_divergence_policy
  value: null
  status: calibration_required
- name: time_at_price_requirement
  value: null
  status: calibration_required
confidence_behavior:
  full_confidence: All required feeds present, data quality clean, calibration available where needed, and primary evidence
    agrees with optional confirmation.
  degraded_confidence_triggers:
  - Optional confirmation feeds are missing.
  - Data quality is usable but incomplete.
  - Adjacent but not exact session/regime context is being used for review only.
  review_required_trigger: Primary evidence and optional confirmation disagree, or the result would require discretionary
    interpretation beyond the spec.
  no_binary_certainty_claim: Outputs are bounded evidence states, not certainty claims or trading instructions.
confidence_rules:
  full_confidence_requires:
  - Required inputs present
  - Clean session/timeframe scope
  - No material evidence conflict
  downgrade_when:
  - Optional feeds absent
  - Specialized feeds absent
  - Calibration absent where required
  - Regime or session mismatch
  refuse_when:
  - Required feeds absent
  - Data unreadable
  - Scope cannot be established
refusal_conditions:
- Required feed missing or stale.
- Session, profile, or timeframe boundary cannot be established.
- Calibration is required but unavailable.
- Evidence would require guessing participant intent, execution behavior, or unavailable feed state.
- Data quality is insufficient for the declared determinism class.
output_labels: &id001
- EFFORT_WITHOUT_RESULT_OBSERVED
- ABSORPTION_EVIDENCE_PRESENT
- ABSORPTION_REVIEW_REQUIRED
- LOW_CONFIDENCE_STRUCTURAL_STALL
- NOT_DETECTABLE_WITH_CURRENT_FEEDS
- DEGRADED_CONFIDENCE
- INSUFFICIENT_EVIDENCE
- REFUSE_TO_CLASSIFY
- CONTEXT_ONLY
- CONFIRMATION_REQUIRED
- REVIEW_REQUIRED
states_emitted: *id001
allowed_action_labels: *id001
false_positive_risks:
- Overclassifying Absorption from a single weak observation.
- Treating optional confirmation as if it were required evidence.
- Using stale or wrong-session references.
- Applying calibration outside its instrument/session/timeframe/regime scope.
false_negative_risks:
- Withholding a valid Absorption state because optional feeds are missing.
- Missing the state because data arrives late or session boundaries are wrong.
- Overly strict future calibration suppresses legitimate evidence.
- Downgrading a structurally valid state because interpretation context is unavailable.
failure_modes:
- Feed outage or stale data.
- Bad session calendar, profile period, or timeframe definition.
- Contract roll or data stitching artifact.
- Regime mismatch or missing calibration.
- Event-window distortion or low-liquidity condition requiring downgrade or review.
validation_requirements:
- Replay labeled Absorption examples and confirm only bounded states are emitted.
- Confirm missing required feeds produce refusal or insufficient-evidence behavior.
- Confirm missing optional feeds degrade confidence without proxy substitution.
- Confirm no output label implies trade permission, entries, exits, stops, targets, sizing, or broker/order behavior.
- Confirm calibrated parameters remain null until later calibration artifacts supply scoped values.
test_cases:
- name: required_feeds_present_supported_state
  expected: EFFORT_WITHOUT_RESULT_OBSERVED
- name: missing_required_feed
  expected: REFUSE_TO_CLASSIFY
- name: missing_optional_confirmation
  expected: DEGRADED_CONFIDENCE
- name: conflicting_evidence
  expected: REVIEW_REQUIRED
- name: missing_calibration_when_required
  expected: CONTEXT_ONLY
