spec_id: ch06_dealer_gamma_dynamics
concept_id: ch06_dealer_gamma_dynamics
concept_name: Dealer Gamma Dynamics
display_name: Dealer Gamma Dynamics
glossary_ref: glossary/chapter_06_traps_positioning.md#dealer-gamma-dynamics
chapter:
  chapter_number: 6
  chapter_title: Traps & Positioning
  glossary_path: glossary/chapter_06_traps_positioning.md
determinism_class: NOT_DETECTABLE_WITH_CURRENT_FEEDS
semantic_source:
  glossary_path: glossary/chapter_06_traps_positioning.md
  concept_heading: Dealer Gamma Dynamics
  doctrine_summary: 'Registry required inputs: Options OI, implied-vol surface, strike exposure, expiration calendar,
    dealer-position model. Optional inputs: None. Missing-feed behavior: Do not claim gamma; describe price behavior
    only. P12 notes: Requires unavailable options data and a model; left unchanged'
purpose: Define a feed-explicit, non-executional detection contract for Dealer Gamma Dynamics as a NOT_DETECTABLE_WITH_CURRENT_FEEDS
  concept.
description: Implementation contract for Dealer Gamma Dynamics. It emits bounded market-read, context, confidence,
  review, and refusal labels according to the registry determinism class, without thresholds, calibration values,
  or executional output.
non_executional_boundary: This spec emits semantic market-read, context, confidence, review, and refusal labels
  only. It never emits trade permission, entry, exit, stop, target, position-sizing, add or reduce, broker, order,
  account, fill, or P&L instructions, and never an autonomous trade call.
required_inputs:
- name: options_oi
  source: options_data_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Dealer Gamma Dynamics: Options OI.'
  absence_behavior: REFUSE_TO_CLASSIFY
- name: implied_vol_surface
  source: options_data_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Dealer Gamma Dynamics: implied-vol surface.'
  absence_behavior: REFUSE_TO_CLASSIFY
- name: strike_exposure
  source: options_data_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Dealer Gamma Dynamics: strike exposure.'
  absence_behavior: REFUSE_TO_CLASSIFY
- name: expiration_calendar
  source: calendar_or_event_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Dealer Gamma Dynamics: expiration calendar.'
  absence_behavior: REFUSE_TO_CLASSIFY
- name: dealer_position_model
  source: dealer_gamma_model_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Dealer Gamma Dynamics: dealer-position model.'
  absence_behavior: REFUSE_TO_CLASSIFY
- name: feed_quality_and_scope_status
  source: feed_monitor_and_scope_module
  granularity: runtime_metadata
  session_dependency: Confirms feeds are fresh, synchronized, and evaluated in the intended instrument/session/timeframe
    scope.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: review_notes_or_higher_context
  source: human_review_or_context_module
  granularity: review_context
  purpose: Optional context for later review; absence must not block refusal-safe output.
  absence_behavior: 'CONTEXT_ONLY: emit only the narrow supported label.'
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: REFUSE_TO_CLASSIFY
  missing_calibration_parameters: REFUSE_TO_CLASSIFY
  stale_or_malformed_data: REFUSE_TO_CLASSIFY
refusal_behavior:
  missing_required_feeds: REFUSE_TO_CLASSIFY
  missing_optional_feeds: REFUSE_TO_CLASSIFY
  missing_calibration: REFUSE_TO_CLASSIFY
  stale_or_malformed_data: REFUSE_TO_CLASSIFY
  out_of_scope_request: REFUSE_TO_CLASSIFY
  executional_output_requested: REFUSE_TO_CLASSIFY
detection_scope:
  allowed_to_classify:
  - DEALER_GAMMA_FEEDS_UNAVAILABLE
  - OPTIONS_OPEN_INTEREST_REQUIRED
  - IMPLIED_VOL_SURFACE_REQUIRED
  - STRIKE_EXPOSURE_MODEL_REQUIRED
  - DEALER_POSITION_MODEL_REQUIRED
  - GAMMA_PROXY_REFUSED
  - PRICE_BEHAVIOR_ONLY_CONTEXT
  - REFUSE_TO_CLASSIFY
  not_allowed_to_classify:
  - Directional prediction
  - Trade permission or setup authorization
  - Entry, exit, stop, target, sizing, broker, order, account, fill, or P&L behavior
  - Autonomous trade calls
  - Unavailable-feed proxy claims
  instrument_scope: Single instrument unless a declared intermarket/cross-asset feed is explicitly listed as required
    or optional.
  session_scope: Configured session definitions and source chapter context only.
  timeframe_scope: Configured timeframe, event window, or review window only.
  regime_scope: Calibration and interpretation must be scoped by instrument, session, timeframe, and regime when
    the registry class requires it.
evidence_model:
  evidence_categories:
  - name: required_evidence_set
    observations:
    - options_oi
    - implied_vol_surface
    - strike_exposure
    - expiration_calendar
    - dealer_position_model
    - feed_quality_and_scope_status
    derivation: All required observations must be present, fresh, synchronized, and in scope before the spec emits
      any non-refusal label.
  - name: optional_confirmation_or_downgrade_set
    observations:
    - review_notes_or_higher_context
    derivation: Optional observations can strengthen, weaken, or downgrade confidence but cannot be assumed or proxied.
  - name: class_boundary
    observations:
    - NOT_DETECTABLE_WITH_CURRENT_FEEDS
    - traps_positioning_and_forced_flow_context
    derivation: The registry determinism class controls whether the output is structural, calibrated, judgment-assisted,
      context-only, or feed-blocked.
  evidence_hierarchy: Required feeds establish the narrow state. Optional feeds adjust confidence and review status.
    The determinism class prevents false promotion into a stronger detector.
  evidence_states:
    supported:
    - DEALER_GAMMA_FEEDS_UNAVAILABLE
    - OPTIONS_OPEN_INTEREST_REQUIRED
    - IMPLIED_VOL_SURFACE_REQUIRED
    - STRIKE_EXPOSURE_MODEL_REQUIRED
    - DEALER_POSITION_MODEL_REQUIRED
    - GAMMA_PROXY_REFUSED
    - PRICE_BEHAVIOR_ONLY_CONTEXT
    - REFUSE_TO_CLASSIFY
    unsupported:
    - trade_signal
    - execution_permission
    - universal_threshold_claim
    - missing_feed_proxy
    - autonomous_classification_beyond_registry_class
rule_structure:
  type: refusal_only_feed_block_contract
  description: P19-hardened state logic with concept-specific labels, class-preserving refusal behavior, and no
    universal thresholds or executional output.
  rules:
  - id: R1_feed_block
    logic: Emit DEALER_GAMMA_FEEDS_UNAVAILABLE when the complete options/open-interest/implied-volatility/strike-exposure/dealer-model
      evidence set is unavailable.
  - id: R2_missing_oi
    logic: Emit OPTIONS_OPEN_INTEREST_REQUIRED when options open interest by strike/expiration is absent or stale.
  - id: R3_missing_iv
    logic: Emit IMPLIED_VOL_SURFACE_REQUIRED when implied-volatility surface data is absent or stale.
  - id: R4_missing_model
    logic: Emit STRIKE_EXPOSURE_MODEL_REQUIRED or DEALER_POSITION_MODEL_REQUIRED when model inputs required for
      dealer-gamma inference are unavailable.
  - id: R5_no_proxy
    logic: Emit GAMMA_PROXY_REFUSED if a caller requests gamma classification from price-only, bar-only, or narrative-only
      inputs; price behavior may be labeled only as PRICE_BEHAVIOR_ONLY_CONTEXT.
  determinism_note: Registry and matrix class is NOT_DETECTABLE_WITH_CURRENT_FEEDS. Later work must not promote
    this spec beyond that class without governance review.
decision_logic:
  summary: P19-hardened evaluation for Dealer Gamma Dynamics using concept-specific states, feed-explicit evidence,
    class-preserving calibration/refusal behavior, and non-executional outputs.
  steps:
  - Validate options open interest, implied-volatility surface, strike exposure, expiration calendar, dealer-position
    model, and feed health.
  - If any required gamma input is missing, stale, or model-incomplete, emit a feed-blocked/refusal state.
  - Do not proxy dealer gamma from price behavior, bar structure, or narrative.
  - Allow PRICE_BEHAVIOR_ONLY_CONTEXT only as ordinary observable price behavior, not gamma classification.
  - Route any future feed-enabled gamma classification to manual doctrine/spec review before use.
  output_boundary: Outputs are read-quality, evidence, context, confidence, review, or refusal labels only.
calibration_parameters: []
parameters: []
confidence_behavior:
  full_confidence: No current-feed gamma classification is allowed. Full confidence is limited to correctly identifying
    that classification is blocked without required options/model feeds.
  degraded_confidence_triggers:
  - Optional feeds are unavailable or stale.
  - Evidence is late, conflicted, thin, poorly located, event-distorted, or outside the calibrated scope.
  - The concept requires judgment that available machine evidence can only assist, not finalize.
  review_required_trigger: A future data provider supplies options open interest, implied-volatility surface, strike
    exposure, expiration, and dealer-position model inputs; doctrine/spec review is required before enabling classification.
  no_binary_certainty_claim: No label asserts certain truth, direction, trade quality, or execution permission.
confidence_rules:
  full_confidence_requires:
  - options_oi
  - implied_vol_surface
  - strike_exposure
  - expiration_calendar
  - dealer_position_model
  - feed_quality_and_scope_status
  downgrade_when:
  - Incomplete options open interest, implied-volatility surface, strike exposure, expiration, or dealer-position
    model.
  - Price behavior is observable but gamma attribution is unavailable.
  - External gamma model inputs are stale, partial, vendor-specific, or unaudited.
  refuse_when:
  - Required feeds are missing, stale, malformed, or out of scope.
  - The requested output requires unavailable external feeds or direct participant intent.
  - The caller asks for executional behavior or autonomous trade output.
refusal_conditions:
- A required feed is missing, stale, malformed, or not synchronized.
- Session, instrument, timeframe, event-window, or regime scope is undefined.
- Calibration is required but no later calibration artifact supplies values.
- The requested classification would require evidence not available in current feeds.
- The requested output would imply trade permission, entry, exit, stop, target, sizing, broker/order/account/fill/P&L
  behavior, or autonomous action.
output_labels:
