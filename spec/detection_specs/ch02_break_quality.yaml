purpose: Define a feed-explicit, non-executional detection contract for Break Quality as a CALIBRATED concept.
description: Implementation contract for Break Quality. It emits bounded market-read, context, confidence, review,
  and refusal labels according to the registry determinism class, without thresholds, calibration values, or executional
  output.
non_executional_boundary: This spec emits semantic market-read, context, confidence, review, and refusal labels
  only. It never emits trade permission, entry, exit, stop, target, position-sizing, add or reduce, broker, order,
  account, fill, or P&L instructions, and never an autonomous trade call.
required_inputs:
- name: price_sequence
  source: market_data_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Break Quality: Price sequence.'
  absence_behavior: REFUSE_TO_CLASSIFY
- name: structural_reference_lattice
  source: reference_level_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Break Quality: structural reference lattice.'
  absence_behavior: REFUSE_TO_CLASSIFY
- name: feed_quality_and_scope_status
  source: feed_monitor_and_scope_module
  granularity: runtime_metadata
  session_dependency: Confirms feeds are fresh, synchronized, and evaluated in the intended instrument/session/timeframe
    scope.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: volatility_baselines
  source: volatility_statistics_module
  granularity: concept_scoped_optional_feed
  purpose: Improves or qualifies the Break Quality read using Volatility baselines.
