  - CLEAN_BREAK_TEXTURE
  - DIRTY_BREAK_TEXTURE
  - IMPULSIVE_BREAK_TEXTURE
  - GRINDING_BREAK_TEXTURE
  - LATE_OR_BOXED_IN_BREAK
  - COARSE_STRUCTURAL_TEXTURE_ONLY
  - BREAK_QUALITY_CALIBRATION_REQUIRED
  - INSUFFICIENT_EVIDENCE
  not_allowed_to_classify:
  - Directional prediction
  - Trade permission or setup authorization
  - Entry, exit, stop, target, sizing, broker, order, account, fill, or P&L behavior
  - Autonomous trade calls
  - Unavailable-feed proxy claims
  instrument_scope: Single instrument unless a declared intermarket/cross-asset feed is explicitly listed as required
    or optional.
  session_scope: Configured session definitions and source chapter context only.
  timeframe_scope: Configured timeframe, event window, or review window only.
  regime_scope: Calibration and interpretation must be scoped by instrument, session, timeframe, and regime when
    the registry class requires it.
evidence_model:
  evidence_categories:
  - name: required_evidence_set
    observations:
    - price_sequence
    - structural_reference_lattice
    - feed_quality_and_scope_status
    derivation: All required observations must be present, fresh, synchronized, and in scope before the spec emits
      any non-refusal label.
  - name: optional_confirmation_or_downgrade_set
    observations:
    - volatility_baselines
    - tape
    derivation: Optional observations can strengthen, weaken, or downgrade confidence but cannot be assumed or proxied.
  - name: class_boundary
    observations:
    - CALIBRATED
    - level_interaction_and_acceptance
    derivation: The registry determinism class controls whether the output is structural, calibrated, judgment-assisted,
      context-only, or feed-blocked.
  evidence_hierarchy: Required feeds establish the narrow state. Optional feeds adjust confidence and review status.
    The determinism class prevents false promotion into a stronger detector.
  evidence_states:
    supported:
    - CLEAN_BREAK_TEXTURE
    - DIRTY_BREAK_TEXTURE
    - IMPULSIVE_BREAK_TEXTURE
    - GRINDING_BREAK_TEXTURE
    - LATE_OR_BOXED_IN_BREAK
    - COARSE_STRUCTURAL_TEXTURE_ONLY
    - BREAK_QUALITY_CALIBRATION_REQUIRED
    - INSUFFICIENT_EVIDENCE
    unsupported:
    - trade_signal
    - execution_permission
    - universal_threshold_claim
    - missing_feed_proxy
    - autonomous_classification_beyond_registry_class
rule_structure:
  type: calibrated_evidence_state_machine
  description: P19-hardened state logic with concept-specific labels, class-preserving refusal behavior, and no
    universal thresholds or executional output.
  rules:
  - id: R1_clean_break_texture
    logic: Emit CLEAN_BREAK_TEXTURE when calibrated candle structure, breach behavior, and follow-through show decisive
      clearing of the reference with room to next structure.
  - id: R2_dirty_break_texture
    logic: Emit DIRTY_BREAK_TEXTURE when price repeatedly breaches and reclaims the reference or overlaps around
      it without a clear winner.
  - id: R3_impulse_vs_grind
    logic: Emit IMPULSIVE_BREAK_TEXTURE or GRINDING_BREAK_TEXTURE from calibrated velocity, overlap, and effort-result
      features, without inferring trade quality.
  - id: R4_location_quality
    logic: Emit LATE_OR_BOXED_IN_BREAK when the break is structurally real but extension, nearby higher-timeframe
      structure, or no-mans-land reference quality weakens expression quality.
  - id: R5_missing_optional
    logic: Emit COARSE_STRUCTURAL_TEXTURE_ONLY when volatility baseline or tape evidence is unavailable; do not
      claim sponsorship or clean expression.
  determinism_note: Registry and matrix class is CALIBRATED. Later work must not promote this spec beyond that class
    without governance review.
decision_logic:
  summary: P19-hardened evaluation for Break Quality using concept-specific states, feed-explicit evidence, class-preserving
    calibration/refusal behavior, and non-executional outputs.
  steps:
  - Validate price sequence, structural reference lattice, session scope, and feed health.
  - Classify break texture from calibrated breach/reclaim, overlap, velocity, and candle-structure features.
  - Apply location-quality checks for late extension, nearby opposing structure, and missing framing references.
  - Use volatility baseline and tape only to refine or downgrade the grade; do not infer them when absent.
  - Emit break-quality grades only, never trade permission or setup authorization.
  output_boundary: Outputs are read-quality, evidence, context, confidence, review, or refusal labels only.
