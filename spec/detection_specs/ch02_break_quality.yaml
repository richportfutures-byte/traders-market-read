- name: tape
  source: order_flow_module
  granularity: concept_scoped_optional_feed
  purpose: Improves or qualifies the Break Quality read using tape.
  absence_behavior: 'DEGRADED_CONFIDENCE: keep the output narrower and do not infer unavailable evidence.'
