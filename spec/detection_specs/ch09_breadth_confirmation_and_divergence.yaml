    - execution_permission
    - universal_threshold_claim
    - missing_feed_proxy
    - autonomous_classification_beyond_registry_class
rule_structure:
  type: calibrated_evidence_state_machine
  description: P19-hardened state logic with concept-specific labels, class-preserving refusal behavior, and no
    universal thresholds or executional output.
  rules:
  - id: R1_confirmation
    logic: Emit BREADTH_CONFIRMS_PRICE when calibrated advance/decline, sector, equal-weight, and constituent participation
      support the index move.
  - id: R2_divergence
    logic: Emit BREADTH_DIVERGES_FROM_PRICE when the traded index advances or declines while participation fails
      to confirm.
  - id: R3_narrow_leadership
    logic: Emit NARROW_LEADERSHIP_WARNING when cap-weighted progress is concentrated in too few names or sectors;
      do not convert warning into reversal.
  - id: R4_broadening
    logic: Emit BROADENING_PARTICIPATION when breadth catches up and prior divergence weakens.
  - id: R5_missing_breadth
    logic: Emit NO_BREADTH_CLAIM when required breadth feeds are unavailable.
  determinism_note: Registry and matrix class is CALIBRATED. Later work must not promote this spec beyond that class
    without governance review.
decision_logic:
  summary: P19-hardened evaluation for Breadth Confirmation & Divergence using concept-specific states, feed-explicit
    evidence, class-preserving calibration/refusal behavior, and non-executional outputs.
  steps:
  - Validate cash index, constituent, advance/decline, sector, equal-weight, and feed-health inputs.
  - Compare headline index movement with calibrated participation, sector, and equal-weight evidence.
  - Classify confirmation, divergence, narrowing, broadening, or no-claim states.
  - Downgrade when breadth feeds are partial or delayed.
  - Emit breadth-quality labels only; divergence is warning evidence, not an automatic reversal detector.
  output_boundary: Outputs are read-quality, evidence, context, confidence, review, or refusal labels only.
