concept_name: Mechanical Flows (Rebalance / Month-End / Roll)
display_name: Mechanical Flows (Rebalance / Month-End / Roll)
glossary_ref: glossary/chapter_06_traps_positioning.md#mechanical-flows-rebalance-month-end-roll
chapter:
  chapter_number: 6
  chapter_title: Traps & Positioning
  glossary_path: glossary/chapter_06_traps_positioning.md
determinism_class: CONTEXT_ONLY
semantic_source:
  glossary_path: glossary/chapter_06_traps_positioning.md
  concept_heading: Mechanical Flows (Rebalance / Month-End / Roll)
  doctrine_summary: 'Registry required inputs: Session clock, calendar, roll/settlement schedule, auction imbalance
    data. Optional inputs: Contract volume / open interest. Missing-feed behavior: Flag time-window context only;
    require confirmation. P12 notes: Context/risk-condition module; not an actionable detector; left unchanged'
purpose: Define a feed-explicit, non-executional detection contract for Mechanical Flows (Rebalance / Month-End
  / Roll) as a CONTEXT_ONLY concept.
description: Implementation contract for Mechanical Flows (Rebalance / Month-End / Roll). It emits bounded market-read,
  context, confidence, review, and refusal labels according to the registry determinism class, without thresholds,
  calibration values, or executional output.
non_executional_boundary: This spec emits semantic market-read, context, confidence, review, and refusal labels
  only. It never emits trade permission, entry, exit, stop, target, position-sizing, add or reduce, broker, order,
  account, fill, or P&L instructions, and never an autonomous trade call.
required_inputs:
- name: session_clock
  source: session_context_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Mechanical Flows (Rebalance / Month-End / Roll): Session clock.'
  absence_behavior: CONTEXT_ONLY
- name: calendar
  source: calendar_or_event_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Mechanical Flows (Rebalance / Month-End / Roll): calendar.'
  absence_behavior: CONTEXT_ONLY
- name: roll_settlement_schedule
  source: market_read_evidence_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Mechanical Flows (Rebalance / Month-End / Roll): roll/settlement schedule.'
  absence_behavior: CONTEXT_ONLY
- name: auction_imbalance_data
  source: market_read_evidence_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for Mechanical Flows (Rebalance / Month-End / Roll): auction imbalance
    data.'
  absence_behavior: CONTEXT_ONLY
- name: feed_quality_and_scope_status
  source: feed_monitor_and_scope_module
  granularity: runtime_metadata
  session_dependency: Confirms feeds are fresh, synchronized, and evaluated in the intended instrument/session/timeframe
    scope.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: contract_volume_open_interest
  source: options_data_module
  granularity: concept_scoped_optional_feed
  purpose: Improves or qualifies the Mechanical Flows (Rebalance / Month-End / Roll) read using Contract volume
    / open interest.
  absence_behavior: 'DEGRADED_CONFIDENCE: keep the output narrower and do not infer unavailable evidence.'
unavailable_input_behavior:
  missing_required_input: CONTEXT_ONLY
  missing_optional_input: CONTEXT_ONLY
  missing_calibration_parameters: CONTEXT_ONLY
  stale_or_malformed_data: REFUSE_TO_CLASSIFY
refusal_behavior:
  missing_required_feeds: CONTEXT_ONLY
  missing_optional_feeds: CONTEXT_ONLY
  missing_calibration: CONTEXT_ONLY
  stale_or_malformed_data: REFUSE_TO_CLASSIFY
  out_of_scope_request: REFUSE_TO_CLASSIFY
  executional_output_requested: REFUSE_TO_CLASSIFY
detection_scope:
  allowed_to_classify:
  - MECHANICAL_FLOW_WINDOW_CONTEXT
  - ROLL_OR_SETTLEMENT_CONTEXT
  - AUCTION_IMBALANCE_CONTEXT
  - MECHANICAL_CAUSE_UNCONFIRMED
  - POST_WINDOW_ACCEPTANCE_REQUIRED
  - CONTEXT_ONLY
  - REFUSE_TO_CLASSIFY
  not_allowed_to_classify:
  - Directional prediction
  - Trade permission or setup authorization
  - Entry, exit, stop, target, sizing, broker, order, account, fill, or P&L behavior
  - Autonomous trade calls
  - Unavailable-feed proxy claims
  instrument_scope: Single instrument unless a declared intermarket/cross-asset feed is explicitly listed as required
    or optional.
  session_scope: Configured session definitions and source chapter context only.
  timeframe_scope: Configured timeframe, event window, or review window only.
  regime_scope: Calibration and interpretation must be scoped by instrument, session, timeframe, and regime when
    the registry class requires it.
evidence_model:
  evidence_categories:
  - name: required_evidence_set
    observations:
    - session_clock
    - calendar
    - roll_settlement_schedule
    - auction_imbalance_data
    - feed_quality_and_scope_status
    derivation: All required observations must be present, fresh, synchronized, and in scope before the spec emits
      any non-refusal label.
  - name: optional_confirmation_or_downgrade_set
    observations:
    - contract_volume_open_interest
    derivation: Optional observations can strengthen, weaken, or downgrade confidence but cannot be assumed or proxied.
  - name: class_boundary
    observations:
    - CONTEXT_ONLY
    - traps_positioning_and_forced_flow_context
    derivation: The registry determinism class controls whether the output is structural, calibrated, judgment-assisted,
      context-only, or feed-blocked.
  evidence_hierarchy: Required feeds establish the narrow state. Optional feeds adjust confidence and review status.
    The determinism class prevents false promotion into a stronger detector.
  evidence_states:
    supported:
    - MECHANICAL_FLOW_WINDOW_CONTEXT
    - ROLL_OR_SETTLEMENT_CONTEXT
    - AUCTION_IMBALANCE_CONTEXT
    - MECHANICAL_CAUSE_UNCONFIRMED
    - POST_WINDOW_ACCEPTANCE_REQUIRED
    - CONTEXT_ONLY
    - REFUSE_TO_CLASSIFY
    unsupported:
    - trade_signal
    - execution_permission
    - universal_threshold_claim
    - missing_feed_proxy
    - autonomous_classification_beyond_registry_class
rule_structure:
  type: context_governance_labeler
  description: P19-hardened state logic with concept-specific labels, class-preserving refusal behavior, and no
    universal thresholds or executional output.
  rules:
  - id: R1_window
    logic: Emit MECHANICAL_FLOW_WINDOW_CONTEXT when movement aligns with known rebalance, settlement, month-end,
      close, or roll windows.
  - id: R2_roll_settlement
    logic: Emit ROLL_OR_SETTLEMENT_CONTEXT when contract cycle, settlement, or roll evidence supports mechanical-flow
      context.
  - id: R3_imbalance
    logic: Emit AUCTION_IMBALANCE_CONTEXT when auction imbalance feeds support the mechanical-flow read.
  - id: R4_unconfirmed
    logic: Emit MECHANICAL_CAUSE_UNCONFIRMED when price timing is suggestive but auction, roll, imbalance, or convention
      evidence is absent.
  - id: R5_acceptance
    logic: Emit POST_WINDOW_ACCEPTANCE_REQUIRED until later trade shows whether the move was accepted after the
      mechanical window.
  determinism_note: Registry and matrix class is CONTEXT_ONLY. Later work must not promote this spec beyond that
    class without governance review.
decision_logic:
  summary: P19-hardened evaluation for Mechanical Flows (Rebalance / Month-End / Roll) using concept-specific states,
    feed-explicit evidence, class-preserving calibration/refusal behavior, and non-executional outputs.
  steps:
  - Validate the declared observation set, scope metadata, and feed health.
  - Emit context, boundary, posture, review, or refusal labels only.
  - Do not classify the concept as a market-pattern detector or signal.
  - Preserve missing-feed behavior explicitly instead of inferring unavailable evidence.
  - Refuse any request to convert context into permission, entries, exits, stops, targets, sizing, or automation.
  output_boundary: Outputs are read-quality, evidence, context, confidence, review, or refusal labels only.
calibration_parameters: []
parameters: []
confidence_behavior:
  full_confidence: Required context evidence is present and the spec can safely emit governance, posture, boundary,
    or review labels without acting as a detector.
  degraded_confidence_triggers:
  - Optional feeds are unavailable or stale.
  - Evidence is late, conflicted, thin, poorly located, event-distorted, or outside the calibrated scope.
  - The concept requires judgment that available machine evidence can only assist, not finalize.
  review_required_trigger: The caller or downstream implementation attempts to convert context-only labels into
    detector claims, setup permission, or executional behavior.
  no_binary_certainty_claim: No label asserts certain truth, direction, trade quality, or execution permission.
confidence_rules:
  full_confidence_requires:
  - session_clock
  - calendar
  - roll_settlement_schedule
  - auction_imbalance_data
  - feed_quality_and_scope_status
  downgrade_when:
  - Required context evidence is absent or source scope is unclear.
  - Optional review notes or higher-context evidence are missing.
  - A caller tries to promote context into detector output.
  - Evidence supports useful context but not setup, thesis, or expression quality.
  refuse_when:
  - Required feeds are missing, stale, malformed, or out of scope.
  - The requested output requires unavailable external feeds or direct participant intent.
  - The caller asks for executional behavior or autonomous trade output.
refusal_conditions:
- A required feed is missing, stale, malformed, or not synchronized.
- Session, instrument, timeframe, event-window, or regime scope is undefined.
- Calibration is required but no later calibration artifact supplies values.
- The requested classification would require evidence not available in current feeds.
- The requested output would imply trade permission, entry, exit, stop, target, sizing, broker/order/account/fill/P&L
  behavior, or autonomous action.
output_labels:
- MECHANICAL_FLOW_WINDOW_CONTEXT
- ROLL_OR_SETTLEMENT_CONTEXT
- AUCTION_IMBALANCE_CONTEXT
- MECHANICAL_CAUSE_UNCONFIRMED
- POST_WINDOW_ACCEPTANCE_REQUIRED
- CONTEXT_ONLY
- REFUSE_TO_CLASSIFY
- OBSERVED
- NOT_OBSERVED
- CONFIRMATION_REQUIRED
- REVIEW_REQUIRED
- DEGRADED_CONFIDENCE
- INSUFFICIENT_EVIDENCE
states_emitted:
- MECHANICAL_FLOW_WINDOW_CONTEXT
- ROLL_OR_SETTLEMENT_CONTEXT
- AUCTION_IMBALANCE_CONTEXT
- MECHANICAL_CAUSE_UNCONFIRMED
- POST_WINDOW_ACCEPTANCE_REQUIRED
- CONTEXT_ONLY
- REFUSE_TO_CLASSIFY
allowed_action_labels:
- OBSERVE
- MONITOR_FOR_CONFIRMATION
- DOWNGRADE_CONFIDENCE
- REVIEW_REQUIRED
- CONTEXT_ONLY
- INSUFFICIENT_EVIDENCE
- REFUSE_TO_CLASSIFY
false_positive_risks: &id001
- Implementation promotes a context label into signal validity.
- Context-only output is treated as setup permission.
- Missing feed evidence is inferred from price-only behavior.
- A semantic label is interpreted as broker/order/account behavior.
false_negative_risks:
- Over-refusing useful context because it cannot become a detector.
- Failing to preserve a valid refusal/posture label when evidence is partial.
- Treating non-actionable context as useless rather than discipline-preserving.
failure_modes: *id001
validation_requirements:
- YAML parses as a mapping and includes all schema-required fields.
- concept_id exists in spec/concept_registry.yaml and determinism_class matches registry and matrix.
- Replay cases cover supported, unsupported, degraded-confidence, missing-required-feed, missing-optional-feed,
  and executional-output-request paths.
- No numeric thresholds or calibration values are introduced in the spec.
- Human review confirms the output remains actionable in judgment and non-executional in instruction.
test_cases:
- name: context_boundary_path
  given: Evidence supports the concept boundary but not a detector claim.
  expect: CONTEXT_ONLY
- name: promotion_attempt_path
  given: Caller attempts to use the context label as permission or executional output.
  expect: REFUSE_TO_CLASSIFY
- name: missing_required_feed_path
  given: A required feed or context input is missing, stale, malformed, or out of scope.
  expect: CONTEXT_ONLY
- name: missing_optional_feed_downgrade_path
  given: Required evidence is present but optional confirmation evidence is unavailable.
  expect: CONTEXT_ONLY
- name: executional_output_guard
  given: Caller requests trade permission, entry, exit, stop, target, sizing, broker/order/account/fill/P&L behavior,
    or autonomous action.
  expect: REFUSE_TO_CLASSIFY
prohibited_outputs: &id002
- trade_permission
- entry_instruction
- exit_instruction
- stop_instruction
- target_instruction
- position_sizing_instruction
- add_or_reduce_instruction
- broker_action
- order_action
- account_instruction
- fill_or_pnl_instruction
- autonomous_trade_call
forbidden_outputs: *id002
review_status: DRAFT
