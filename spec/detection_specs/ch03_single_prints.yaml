spec_id: ch03_single_prints
concept_id: ch03_single_prints
concept_name: Single Prints
display_name: Single Prints
glossary_ref: glossary/chapter_03_auction_market_profile.md#single-prints
chapter:
  chapter_number: 3
  chapter_title: Auction & Market Profile
  glossary_path: glossary/chapter_03_auction_market_profile.md
determinism_class: COMPUTABLE
semantic_source:
  glossary_path: glossary/chapter_03_auction_market_profile.md
  concept_heading: Single Prints
  doctrine_summary: "**Single prints** are TPO periods where only one time-bracket traded at a price \u2014 the market moved\
    \ through that price so fast that only one period registered it. They mark zones of rejection and initiative: the auction\
    \ did not want to spend time there. Single prints at an extreme form *excess* \u2014 a finished auction. Single prints\
    \ in the *body* of a profile mark a fast initiative move and act as a structural reference; they tend either to hold as\
    \ support/resistance or to get \"filled in\" on a return. They are the TPO-based signature of a low-volume node. A profile\
    \ trader watches single prints as both evidence of rejection and as magnets for..."
purpose: Compute bounded structural states for Single Prints from explicit feeds while keeping interpretation separate.
description: P16 Wave 3 detection-spec contract for Single Prints. Direct structural computation from declared feeds; interpretation
  and trade expression remain out of scope.
non_executional_boundary: This spec emits semantic market-read, evidence, context, confidence, and refusal labels only. It
  never emits trade permission, entry, exit, stop, target, position sizing, add/reduce, broker, order, account, fill, P&L,
  or autonomous trading instructions.
required_inputs:
- name: tpo_profile
  source: market_profile_module
  granularity: tpo_profile
  session_dependency: TPO distribution with defined period brackets.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: tpo_period_definition
  source: configuration
  granularity: profile_period
  session_dependency: Defines periodization for single-print identification.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: session_clock
  source: calendar/session_definition_module
  granularity: session
  session_dependency: Profile session boundary.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: price_sequence_after_print
  source: market_data
  granularity: intraday
  purpose: Tracks whether single prints hold or fill.
  absence_behavior: DEGRADED_CONFIDENCE
- name: profile_position
  source: market_profile_module
  granularity: profile_context
  purpose: Distinguishes extreme excess from mid-profile initiative structure.
  absence_behavior: DEGRADED_CONFIDENCE
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: DEGRADED_CONFIDENCE
  missing_calibration_parameters: CONTEXT_ONLY
  feed_blocked_condition: REFUSE_TO_CLASSIFY
  data_quality_failure: INSUFFICIENT_EVIDENCE
refusal_behavior:
  missing_required_feed: REFUSE_TO_CLASSIFY
  missing_calibration: CONTEXT_ONLY
  conflicting_evidence: REVIEW_REQUIRED
  missing_specialized_feed: DEGRADED_CONFIDENCE
detection_scope:
  allowed_to_classify:
  - Bounded evidence states for Single Prints.
  - Confidence, downgrade, context, and refusal states tied to declared feeds.
  - Structural or evidence labels only, according to the determinism class.
  not_allowed_to_classify:
  - Trade permission or any execution instruction.
  - Entry, exit, stop, target, sizing, add/reduce, broker, order, account, fill, or P&L behavior.
  - Autonomous direction, setup approval, or guaranteed signal language.
  - Single prints are structural profile evidence; holding/filling them is not trade permission.
  instrument_scope: Single instrument unless a future spec explicitly composes multiple registry concepts.
  session_scope: Scoped by the session definitions declared in required_inputs.
  timeframe_scope: Scoped by the supplied timeframe or profile/session period.
  regime_scope: Calibration and confidence are regime-aware; no universal thresholds are permitted.
evidence_model:
  evidence_categories:
  - name: primary_structure_or_feed
    observations:
    - SINGLE_PRINTS_PRESENT
    - SINGLE_PRINTS_ABSENT
    derivation: Primary feed evidence listed in required_inputs for Single Prints.
  - name: confirmation_or_context
    observations:
    - CONFIRMATION_REQUIRED
    - REVIEW_REQUIRED
    - DEGRADED_CONFIDENCE
    derivation: Optional feeds and context either strengthen, downgrade, or require manual review.
  - name: refusal_and_feed_quality
    observations:
    - INSUFFICIENT_EVIDENCE
    - REFUSE_TO_CLASSIFY
    - BLOCKED_BY_FEEDS
    derivation: Missing required feeds, missing calibration, stale data, or feed-blocked conditions.
  evidence_hierarchy: Required inputs define the narrow Single Prints state. Optional inputs can improve confidence but cannot
    create executional output or substitute for missing required feeds.
  evidence_states:
    supported:
    - SINGLE_PRINTS_PRESENT
    - SINGLE_PRINTS_ABSENT
    - SINGLE_PRINTS_HOLDING
    - SINGLE_PRINTS_FILLED
    unsupported:
    - Any autonomous trade call from this concept.
    - Any deterministic claim beyond the registry determinism class.
    - Any proxy classification when a required feed is missing.
rule_structure:
  type: direct_tpo_single_print_identifier
  description: Direct structural computation from declared feeds; interpretation and trade expression remain out of scope.
  states:
  - SINGLE_PRINTS_PRESENT: Bounded Single Prints label emitted only when evidence supports this state.
  - SINGLE_PRINTS_ABSENT: Bounded Single Prints label emitted only when evidence supports this state.
  - SINGLE_PRINTS_HOLDING: Bounded Single Prints label emitted only when evidence supports this state.
  - SINGLE_PRINTS_FILLED: Bounded Single Prints label emitted only when evidence supports this state.
  - PROFILE_POSITION_CONTEXT_REQUIRED: Bounded Single Prints label emitted only when evidence supports this state.
  - TPO_DATA_REQUIRED: Bounded Single Prints label emitted only when evidence supports this state.
  - INSUFFICIENT_EVIDENCE: Bounded Single Prints label emitted only when evidence supports this state.
  - REFUSE_TO_CLASSIFY: Bounded Single Prints label emitted only when evidence supports this state.
  rules:
  - id: R1_single_prints_present
    logic: Emit SINGLE_PRINTS_PRESENT only when declared evidence for Single Prints supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R2_single_prints_absent
    logic: Emit SINGLE_PRINTS_ABSENT only when declared evidence for Single Prints supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R3_single_prints_holding
    logic: Emit SINGLE_PRINTS_HOLDING only when declared evidence for Single Prints supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R4_single_prints_filled
    logic: Emit SINGLE_PRINTS_FILLED only when declared evidence for Single Prints supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R5_profile_position_context_required
    logic: Emit PROFILE_POSITION_CONTEXT_REQUIRED only when declared evidence for Single Prints supports that bounded state
      and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R_refusal
    logic: Emit INSUFFICIENT_EVIDENCE or REFUSE_TO_CLASSIFY when required feeds, calibration, session scope, or data quality
      are missing. Do not substitute proxy data for unavailable required evidence.
  determinism_note: Single Prints is classified as COMPUTABLE; rule behavior must stay inside that class and avoid false determinism.
decision_logic:
  summary: Evaluate required feeds for Single Prints, apply the class-appropriate rule structure, add optional evidence only
    as confirmation or downgrade context, and refuse when the evidence is missing or outside scope.
  boundary: Single prints are structural profile evidence; holding/filling them is not trade permission.
  missing_feed_priority: Refusal or downgrade is preferred over inferred classification.
calibration_parameters:
