- name: fill_detection_policy
  value: null
  status: calibration_required
  unit: configured
  calibration_scope: instrument_session_timeframe_regime
  description: fill_detection_policy parameter; value must be supplied by later calibration or method configuration, not P16.
parameters:
- name: tpo_period_definition
  value: null
  status: calibration_required
- name: single_print_adjacency_policy
  value: null
  status: calibration_required
- name: fill_detection_policy
  value: null
  status: calibration_required
confidence_behavior:
  full_confidence: All required feeds present, data quality clean, calibration available where needed, and primary evidence
    agrees with optional confirmation.
  degraded_confidence_triggers:
  - Optional confirmation feeds are missing.
  - Data quality is usable but incomplete.
  - Adjacent but not exact session/regime context is being used for review only.
  review_required_trigger: Primary evidence and optional confirmation disagree, or the result would require discretionary
    interpretation beyond the spec.
  no_binary_certainty_claim: Outputs are bounded evidence states, not certainty claims or trading instructions.
confidence_rules:
  full_confidence_requires:
  - Required inputs present
  - Clean session/timeframe scope
  - No material evidence conflict
  downgrade_when:
  - Optional feeds absent
  - Specialized feeds absent
  - Calibration absent where required
  - Regime or session mismatch
  refuse_when:
  - Required feeds absent
  - Data unreadable
  - Scope cannot be established
refusal_conditions:
- Required feed missing or stale.
- Session, profile, or timeframe boundary cannot be established.
- Calibration is required but unavailable.
- Evidence would require guessing participant intent, execution behavior, or unavailable feed state.
- Data quality is insufficient for the declared determinism class.
output_labels: &id001
- SINGLE_PRINTS_PRESENT
- SINGLE_PRINTS_ABSENT
- SINGLE_PRINTS_HOLDING
- SINGLE_PRINTS_FILLED
- PROFILE_POSITION_CONTEXT_REQUIRED
- TPO_DATA_REQUIRED
- INSUFFICIENT_EVIDENCE
- REFUSE_TO_CLASSIFY
- CONTEXT_ONLY
- CONFIRMATION_REQUIRED
- REVIEW_REQUIRED
- DEGRADED_CONFIDENCE
states_emitted: *id001
allowed_action_labels: *id001
false_positive_risks:
- Overclassifying Single Prints from a single weak observation.
- Treating optional confirmation as if it were required evidence.
- Using stale or wrong-session references.
- Applying calibration outside its instrument/session/timeframe/regime scope.
false_negative_risks:
- Withholding a valid Single Prints state because optional feeds are missing.
- Missing the state because data arrives late or session boundaries are wrong.
- Overly strict future calibration suppresses legitimate evidence.
- Downgrading a structurally valid state because interpretation context is unavailable.
failure_modes:
- Feed outage or stale data.
- Bad session calendar, profile period, or timeframe definition.
- Contract roll or data stitching artifact.
- Regime mismatch or missing calibration.
- Event-window distortion or low-liquidity condition requiring downgrade or review.
validation_requirements:
- Replay labeled Single Prints examples and confirm only bounded states are emitted.
- Confirm missing required feeds produce refusal or insufficient-evidence behavior.
- Confirm missing optional feeds degrade confidence without proxy substitution.
- Confirm no output label implies trade permission, entries, exits, stops, targets, sizing, or broker/order behavior.
- Confirm calibrated parameters remain null until later calibration artifacts supply scoped values.
test_cases:
- name: required_feeds_present_supported_state
  expected: SINGLE_PRINTS_PRESENT
- name: missing_required_feed
  expected: REFUSE_TO_CLASSIFY
- name: missing_optional_confirmation
  expected: DEGRADED_CONFIDENCE
- name: conflicting_evidence
  expected: REVIEW_REQUIRED
- name: missing_calibration_when_required
  expected: CONTEXT_ONLY
