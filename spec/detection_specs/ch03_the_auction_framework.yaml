spec_id: ch03_the_auction_framework
concept_id: ch03_the_auction_framework
concept_name: The Auction Framework
display_name: The Auction Framework
glossary_ref: glossary/chapter_03_auction_market_profile.md#the-auction-framework
chapter:
  chapter_number: 3
  chapter_title: Auction & Market Profile
  glossary_path: glossary/chapter_03_auction_market_profile.md
determinism_class: CALIBRATED
semantic_source:
  glossary_path: glossary/chapter_03_auction_market_profile.md
  concept_heading: The Auction Framework
  doctrine_summary: 'Registry required inputs: Price/bar structure. Optional inputs: Market Profile / volume-at-price.
    Missing-feed behavior: Downgrade to bar-structure regime context. P12 notes: Balance/imbalance/transition state;
    transitions lower confidence; Detection Readiness added in P12'
purpose: Define a feed-explicit, non-executional detection contract for The Auction Framework as a CALIBRATED concept.
description: Implementation contract for The Auction Framework. It emits bounded market-read, context, confidence,
  review, and refusal labels according to the registry determinism class, without thresholds, calibration values,
  or executional output.
non_executional_boundary: This spec emits semantic market-read, context, confidence, review, and refusal labels
  only. It never emits trade permission, entry, exit, stop, target, position-sizing, add or reduce, broker, order,
  account, fill, or P&L instructions, and never an autonomous trade call.
required_inputs:
- name: price_bar_structure
  source: market_data_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for The Auction Framework: Price/bar structure.'
  absence_behavior: REFUSE_TO_CLASSIFY
- name: feed_quality_and_scope_status
  source: feed_monitor_and_scope_module
  granularity: runtime_metadata
  session_dependency: Confirms feeds are fresh, synchronized, and evaluated in the intended instrument/session/timeframe
    scope.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: market_profile_volume_at_price
  source: profile_module
  granularity: concept_scoped_optional_feed
  purpose: Improves or qualifies the The Auction Framework read using Market Profile / volume-at-price.
  absence_behavior: 'DEGRADED_CONFIDENCE: keep the output narrower and do not infer unavailable evidence.'
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: DEGRADED_CONFIDENCE
  missing_calibration_parameters: INSUFFICIENT_EVIDENCE
  stale_or_malformed_data: REFUSE_TO_CLASSIFY
refusal_behavior:
  missing_required_feeds: REFUSE_TO_CLASSIFY
  missing_optional_feeds: DEGRADED_CONFIDENCE
  missing_calibration: INSUFFICIENT_EVIDENCE
  stale_or_malformed_data: REFUSE_TO_CLASSIFY
  out_of_scope_request: REFUSE_TO_CLASSIFY
  executional_output_requested: REFUSE_TO_CLASSIFY
detection_scope:
  allowed_to_classify:
  - BALANCED_AUCTION_CONTEXT
  - IMBALANCED_AUCTION_CONTEXT
  - BALANCE_TO_IMBALANCE_TRANSITION
  - IMBALANCE_TO_BALANCE_REPAIR
  - BAR_STRUCTURE_REGIME_ONLY
  - AUCTION_REGIME_REVIEW_REQUIRED
  - CALIBRATION_REQUIRED
  - INSUFFICIENT_EVIDENCE
  not_allowed_to_classify:
  - Directional prediction
  - Trade permission or setup authorization
  - Entry, exit, stop, target, sizing, broker, order, account, fill, or P&L behavior
  - Autonomous trade calls
  - Unavailable-feed proxy claims
  instrument_scope: Single instrument unless a declared intermarket/cross-asset feed is explicitly listed as required
    or optional.
  session_scope: Configured session definitions and source chapter context only.
  timeframe_scope: Configured timeframe, event window, or review window only.
  regime_scope: Calibration and interpretation must be scoped by instrument, session, timeframe, and regime when
    the registry class requires it.
evidence_model:
  evidence_categories:
  - name: required_evidence_set
    observations:
    - price_bar_structure
    - feed_quality_and_scope_status
    derivation: All required observations must be present, fresh, synchronized, and in scope before the spec emits
      any non-refusal label.
  - name: optional_confirmation_or_downgrade_set
    observations:
    - market_profile_volume_at_price
    derivation: Optional observations can strengthen, weaken, or downgrade confidence but cannot be assumed or proxied.
  - name: class_boundary
    observations:
    - CALIBRATED
    - auction_and_profile_context
    derivation: The registry determinism class controls whether the output is structural, calibrated, judgment-assisted,
      context-only, or feed-blocked.
  evidence_hierarchy: Required feeds establish the narrow state. Optional feeds adjust confidence and review status.
    The determinism class prevents false promotion into a stronger detector.
  evidence_states:
    supported:
    - BALANCED_AUCTION_CONTEXT
    - IMBALANCED_AUCTION_CONTEXT
    - BALANCE_TO_IMBALANCE_TRANSITION
    - IMBALANCE_TO_BALANCE_REPAIR
    - BAR_STRUCTURE_REGIME_ONLY
    - AUCTION_REGIME_REVIEW_REQUIRED
    - CALIBRATION_REQUIRED
    - INSUFFICIENT_EVIDENCE
    unsupported:
    - trade_signal
    - execution_permission
    - universal_threshold_claim
    - missing_feed_proxy
    - autonomous_classification_beyond_registry_class
rule_structure:
  type: calibrated_evidence_state_machine
  description: P19-hardened state logic with concept-specific labels, class-preserving refusal behavior, and no
    universal thresholds or executional output.
  rules:
  - id: R1_balance
    logic: Emit BALANCED_AUCTION_CONTEXT when calibrated rotation, distribution-shape, and value-overlap evidence
      show two-sided trade and value establishment.
  - id: R2_imbalance
    logic: Emit IMBALANCED_AUCTION_CONTEXT when calibrated directional travel, value migration, and reduced rotation
      show one-sided trade and value relocation.
  - id: R3_transition
    logic: Emit BALANCE_TO_IMBALANCE_TRANSITION when price begins leaving balance but acceptance or value migration
      is incomplete.
  - id: R4_repair
    logic: Emit IMBALANCE_TO_BALANCE_REPAIR when a prior directional auction begins overlapping, rotating, and rebuilding
      value.
  - id: R5_missing_profile
    logic: Emit BAR_STRUCTURE_REGIME_ONLY when Market Profile or volume-at-price data is unavailable.
  determinism_note: Registry and matrix class is CALIBRATED. Later work must not promote this spec beyond that class
    without governance review.
decision_logic:
  summary: P19-hardened evaluation for The Auction Framework using concept-specific states, feed-explicit evidence,
    class-preserving calibration/refusal behavior, and non-executional outputs.
  steps:
  - Validate price/bar structure, session scope, profile availability, and feed health.
  - Evaluate rotation, directional travel, distribution shape, value overlap, and value migration with calibrated
    parameters.
  - Classify balance, imbalance, transition, or repair without selecting a playbook.
  - Downgrade to bar-structure regime context when profile/value inputs are missing.
  - Emit regime labels only; no fade or continuation authorization is allowed.
  output_boundary: Outputs are read-quality, evidence, context, confidence, review, or refusal labels only.
calibration_parameters:
- name: the_auction_framework_classification_requirement
  value: null
  status: calibration_required
  unit: relative_or_sequence_measure
  calibration_scope: instrument_session_timeframe_regime
  description: Calibrated evidence requirement for The Auction Framework.
- name: the_auction_framework_confirmation_window
  value: null
  status: calibration_required
  unit: duration_or_bars
  calibration_scope: instrument_session_timeframe_regime
  description: Review window for confirmation, failure, downgrade, or refusal behavior.
- name: the_auction_framework_conflict_downgrade_rule
  value: null
  status: calibration_required
  unit: evidence_conflict_rule
  calibration_scope: instrument_session_timeframe_regime
  description: Rule for downgrading when required and optional evidence conflict.
parameters:
- name: the_auction_framework_classification_requirement
  value: null
  status: calibration_required
- name: the_auction_framework_confirmation_window
  value: null
  status: calibration_required
- name: the_auction_framework_conflict_downgrade_rule
  value: null
  status: calibration_required
confidence_behavior:
  full_confidence: All required feeds are present, fresh, scoped correctly, and the class-appropriate evidence conditions
    are satisfied.
  degraded_confidence_triggers:
  - Optional feeds are unavailable or stale.
  - Evidence is late, conflicted, thin, poorly located, event-distorted, or outside the calibrated scope.
  - The concept requires judgment that available machine evidence can only assist, not finalize.
  review_required_trigger: Evidence supports more than context but remains mixed enough that human or later model
    review is required.
  no_binary_certainty_claim: No label asserts certain truth, direction, trade quality, or execution permission.
confidence_rules:
  full_confidence_requires:
  - price_bar_structure
  - feed_quality_and_scope_status
  downgrade_when:
  - Profile or volume-at-price evidence is missing.
  - Value overlap and price rotation disagree.
  - The auction is transitioning between regimes.
  - Higher-timeframe auction context conflicts with intraday regime.
  refuse_when:
  - Required feeds are missing, stale, malformed, or out of scope.
  - The requested output requires unavailable external feeds or direct participant intent.
  - The caller asks for executional behavior or autonomous trade output.
refusal_conditions:
- A required feed is missing, stale, malformed, or not synchronized.
- Session, instrument, timeframe, event-window, or regime scope is undefined.
- Calibration is required but no later calibration artifact supplies values.
- The requested classification would require evidence not available in current feeds.
- The requested output would imply trade permission, entry, exit, stop, target, sizing, broker/order/account/fill/P&L
  behavior, or autonomous action.
output_labels:
- BALANCED_AUCTION_CONTEXT
- IMBALANCED_AUCTION_CONTEXT
- BALANCE_TO_IMBALANCE_TRANSITION
- IMBALANCE_TO_BALANCE_REPAIR
- BAR_STRUCTURE_REGIME_ONLY
- AUCTION_REGIME_REVIEW_REQUIRED
- CALIBRATION_REQUIRED
- INSUFFICIENT_EVIDENCE
- OBSERVED
- NOT_OBSERVED
- CONFIRMATION_REQUIRED
- REVIEW_REQUIRED
- DEGRADED_CONFIDENCE
- CONTEXT_ONLY
- REFUSE_TO_CLASSIFY
states_emitted:
- BALANCED_AUCTION_CONTEXT
- IMBALANCED_AUCTION_CONTEXT
- BALANCE_TO_IMBALANCE_TRANSITION
- IMBALANCE_TO_BALANCE_REPAIR
- BAR_STRUCTURE_REGIME_ONLY
- AUCTION_REGIME_REVIEW_REQUIRED
- CALIBRATION_REQUIRED
- INSUFFICIENT_EVIDENCE
allowed_action_labels:
- OBSERVE
- MONITOR_FOR_CONFIRMATION
- DOWNGRADE_CONFIDENCE
- REVIEW_REQUIRED
- CONTEXT_ONLY
- INSUFFICIENT_EVIDENCE
- REFUSE_TO_CLASSIFY
false_positive_risks:
- Calling every elongated profile a trend without value migration.
- Treating balance/imbalance as a trading playbook selector.
- Using stale profile calibration after volatility regime change.
- Ignoring higher-timeframe auction context.
- Treating calibrated evidence as deterministic truth rather than calibrated state support.
false_negative_risks:
- Over-refusing when core structural evidence is present but optional feeds are absent.
- Missing a valid weaker state because calibrated confirmation is unavailable.
- Treating missing calibration as proof that the concept is absent.
failure_modes:
- Calling every elongated profile a trend without value migration.
- Treating balance/imbalance as a trading playbook selector.
- Using stale profile calibration after volatility regime change.
- Ignoring higher-timeframe auction context.
validation_requirements:
- YAML parses as a mapping and includes all schema-required fields.
- concept_id exists in spec/concept_registry.yaml and determinism_class matches registry and matrix.
- Replay cases cover supported, unsupported, degraded-confidence, missing-required-feed, missing-optional-feed,
  and executional-output-request paths.
- No numeric thresholds or calibration values are introduced in the spec.
- Human review confirms the output remains actionable in judgment and non-executional in instruction.
test_cases:
- name: balance_path
  given: Price rotates around POC with calibrated distribution symmetry and value overlap.
  expect: BALANCED_AUCTION_CONTEXT
- name: imbalance_path
  given: Price travels directionally with value migration and reduced overlap.
  expect: IMBALANCED_AUCTION_CONTEXT
- name: missing_profile_path
  given: Bars are available but profile/value data is unavailable.
  expect: BAR_STRUCTURE_REGIME_ONLY with DEGRADED_CONFIDENCE
- name: missing_required_feed_path
  given: A required feed or context input is missing, stale, malformed, or out of scope.
  expect: REFUSE_TO_CLASSIFY
- name: missing_optional_feed_downgrade_path
  given: Required evidence is present but optional confirmation evidence is unavailable.
  expect: DEGRADED_CONFIDENCE
- name: executional_output_guard
  given: Caller requests trade permission, entry, exit, stop, target, sizing, broker/order/account/fill/P&L behavior,
    or autonomous action.
  expect: REFUSE_TO_CLASSIFY
