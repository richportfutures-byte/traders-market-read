- target_instruction
- position_sizing_instruction
- add_or_reduce_instruction
- broker_action
- order_action
- account_instruction
- fill_or_pnl_instruction
- autonomous_trade_call
forbidden_outputs: *id001
review_status: DRAFT
notes: 'P18 complete-remaining spec generated from registry concept ch03_the_auction_framework and matrix row for
