spec_id: ch07_ny_inheritance_vs_rejection
concept_id: ch07_ny_inheritance_vs_rejection
concept_name: NY Inheritance vs. Rejection
display_name: NY Inheritance vs. Rejection
glossary_ref: glossary/chapter_07_session_context_sequencing.md#ny-inheritance-vs-rejection
chapter:
  chapter_number: 7
  chapter_title: Session Context & Sequencing
  glossary_path: glossary/chapter_07_session_context_sequencing.md
determinism_class: JUDGMENT_ASSISTED
semantic_source:
  glossary_path: glossary/chapter_07_session_context_sequencing.md
  concept_heading: NY Inheritance vs. Rejection
  doctrine_summary: 'Registry required inputs: Session bars, prior value/profile references, volume, session clock.
    Optional inputs: Delta, footprint, DOM, internals, intermarket. Missing-feed behavior: Keep contextual. P12
    notes: Left unchanged'
purpose: Define a feed-explicit, non-executional detection contract for NY Inheritance vs. Rejection as a JUDGMENT_ASSISTED
  concept.
description: Implementation contract for NY Inheritance vs. Rejection. It emits bounded market-read, context, confidence,
  review, and refusal labels according to the registry determinism class, without thresholds, calibration values,
  or executional output.
non_executional_boundary: This spec emits semantic market-read, context, confidence, review, and refusal labels
  only. It never emits trade permission, entry, exit, stop, target, position-sizing, add or reduce, broker, order,
  account, fill, or P&L instructions, and never an autonomous trade call.
required_inputs:
- name: session_bars
  source: session_context_module
  granularity: concept_scoped_feed_or_observation
  session_dependency: 'Required evidence for NY Inheritance vs. Rejection: Session bars.'
  absence_behavior: INSUFFICIENT_EVIDENCE
- name: prior_value_profile_references
  source: profile_module
  granularity: concept_scoped_feed_or_observation
