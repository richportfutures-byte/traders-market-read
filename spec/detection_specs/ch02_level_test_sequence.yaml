spec_id: ch02_level_test_sequence
concept_id: ch02_level_test_sequence
concept_name: Level Test Sequence
display_name: Level Test Sequence
glossary_ref: glossary/chapter_02_level_interaction_acceptance.md#level-test-sequence
chapter:
  chapter_number: 2
  chapter_title: Level Interaction & Acceptance
  glossary_path: glossary/chapter_02_level_interaction_acceptance.md
determinism_class: CALIBRATED
semantic_source:
  glossary_path: glossary/chapter_02_level_interaction_acceptance.md
  concept_heading: Level Test Sequence
  doctrine_summary: "How many times a level has been tested changes what the next test means. The **first test of a level**\
    \ is the level fresh, defenders in place \u2014 the highest-probability hold or rejection, and the test carrying the cleanest\
    \ information. The **second test** is still credible, but some defensive liquidity has already been consumed. **Third\
    \ test exhaustion** is the key idea: by the third (or later) test, the resting orders defending the level have largely\
    \ been worked through, and a level tested repeatedly in quick succession is far more likely to break on the next attempt.\
    \ The retail clich\xE9 \"the more times a level is tested, the stronger it..."
purpose: Classify bounded Level Test Sequence states using a calibrated rule structure with all empirical values deferred
  to later calibration artifacts.
description: P16 Wave 3 detection-spec contract for Level Test Sequence. Fixed rule structure with named parameters. Values
  remain null until calibrated per instrument, session, timeframe, and regime.
non_executional_boundary: This spec emits semantic market-read, evidence, context, confidence, and refusal labels only. It
  never emits trade permission, entry, exit, stop, target, position sizing, add/reduce, broker, order, account, fill, P&L,
  or autonomous trading instructions.
required_inputs:
- name: structural_level
  source: structural_reference_module
  granularity: price
  session_dependency: Level whose tests are counted.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: price_sequence
  source: market_data
  granularity: intraday
  session_dependency: Touches, reactions, separation, and retests.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: session_clock
  source: calendar/session_definition_module
  granularity: session
  session_dependency: Test-count window and session scope.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: volume_by_test
  source: volume_feed
  granularity: per_test
  purpose: Grades whether reactions are strengthening or weakening.
  absence_behavior: DEGRADED_CONFIDENCE
- name: aggression_by_test
  source: order_flow_module
  granularity: per_test
  purpose: Improves read of pressure building into the level.
  absence_behavior: DEGRADED_CONFIDENCE
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: DEGRADED_CONFIDENCE
  missing_calibration_parameters: INSUFFICIENT_EVIDENCE
  feed_blocked_condition: REFUSE_TO_CLASSIFY
  data_quality_failure: INSUFFICIENT_EVIDENCE
refusal_behavior:
  missing_required_feed: REFUSE_TO_CLASSIFY
  missing_calibration: INSUFFICIENT_EVIDENCE
  conflicting_evidence: REVIEW_REQUIRED
  missing_specialized_feed: DEGRADED_CONFIDENCE
detection_scope:
  allowed_to_classify:
  - Bounded evidence states for Level Test Sequence.
  - Confidence, downgrade, context, and refusal states tied to declared feeds.
  - Structural or evidence labels only, according to the determinism class.
  not_allowed_to_classify:
  - Trade permission or any execution instruction.
  - Entry, exit, stop, target, sizing, add/reduce, broker, order, account, fill, or P&L behavior.
  - Autonomous direction, setup approval, or guaranteed signal language.
  - Test count informs read quality; it is not a break prediction or mechanical action rule.
  instrument_scope: Single instrument unless a future spec explicitly composes multiple registry concepts.
  session_scope: Scoped by the session definitions declared in required_inputs.
  timeframe_scope: Scoped by the supplied timeframe or profile/session period.
  regime_scope: Calibration and confidence are regime-aware; no universal thresholds are permitted.
evidence_model:
  evidence_categories:
  - name: primary_structure_or_feed
    observations:
    - TEST_COUNT_OBSERVED
    - FIRST_TEST_CONTEXT
    derivation: Primary feed evidence listed in required_inputs for Level Test Sequence.
  - name: confirmation_or_context
    observations:
    - CONFIRMATION_REQUIRED
    - REVIEW_REQUIRED
    - DEGRADED_CONFIDENCE
    derivation: Optional feeds and context either strengthen, downgrade, or require manual review.
  - name: refusal_and_feed_quality
    observations:
    - INSUFFICIENT_EVIDENCE
    - REFUSE_TO_CLASSIFY
    - BLOCKED_BY_FEEDS
    derivation: Missing required feeds, missing calibration, stale data, or feed-blocked conditions.
  evidence_hierarchy: Required inputs define the narrow Level Test Sequence state. Optional inputs can improve confidence
    but cannot create executional output or substitute for missing required feeds.
  evidence_states:
    supported:
    - TEST_COUNT_OBSERVED
    - FIRST_TEST_CONTEXT
    - REPEATED_TEST_DECAY
    - LEVEL_EXHAUSTION_REVIEW
    unsupported:
    - Any autonomous trade call from this concept.
    - Any deterministic claim beyond the registry determinism class.
    - Any proxy classification when a required feed is missing.
rule_structure:
  type: calibrated_test_sequence_counter
  description: Fixed rule structure with named parameters. Values remain null until calibrated per instrument, session, timeframe,
    and regime.
  states:
  - TEST_COUNT_OBSERVED: Bounded Level Test Sequence label emitted only when evidence supports this state.
  - FIRST_TEST_CONTEXT: Bounded Level Test Sequence label emitted only when evidence supports this state.
  - REPEATED_TEST_DECAY: Bounded Level Test Sequence label emitted only when evidence supports this state.
  - LEVEL_EXHAUSTION_REVIEW: Bounded Level Test Sequence label emitted only when evidence supports this state.
  - REACTION_SUPPORTED: Bounded Level Test Sequence label emitted only when evidence supports this state.
  - STRUCTURAL_TEST_COUNT_ONLY: Bounded Level Test Sequence label emitted only when evidence supports this state.
  - DEGRADED_CONFIDENCE: Bounded Level Test Sequence label emitted only when evidence supports this state.
  - INSUFFICIENT_EVIDENCE: Bounded Level Test Sequence label emitted only when evidence supports this state.
  - REFUSE_TO_CLASSIFY: Bounded Level Test Sequence label emitted only when evidence supports this state.
  rules:
  - id: R1_test_count_observed
    logic: Emit TEST_COUNT_OBSERVED only when declared evidence for Level Test Sequence supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R2_first_test_context
    logic: Emit FIRST_TEST_CONTEXT only when declared evidence for Level Test Sequence supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R3_repeated_test_decay
    logic: Emit REPEATED_TEST_DECAY only when declared evidence for Level Test Sequence supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R4_level_exhaustion_review
    logic: Emit LEVEL_EXHAUSTION_REVIEW only when declared evidence for Level Test Sequence supports that bounded state and
      required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R5_reaction_supported
    logic: Emit REACTION_SUPPORTED only when declared evidence for Level Test Sequence supports that bounded state and required
      feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R_refusal
    logic: Emit INSUFFICIENT_EVIDENCE or REFUSE_TO_CLASSIFY when required feeds, calibration, session scope, or data quality
      are missing. Do not substitute proxy data for unavailable required evidence.
  determinism_note: Level Test Sequence is classified as CALIBRATED; rule behavior must stay inside that class and avoid false
    determinism.
decision_logic:
  summary: Evaluate required feeds for Level Test Sequence, apply the class-appropriate rule structure, add optional evidence
    only as confirmation or downgrade context, and refuse when the evidence is missing or outside scope.
  boundary: Test count informs read quality; it is not a break prediction or mechanical action rule.
  missing_feed_priority: Refusal or downgrade is preferred over inferred classification.
