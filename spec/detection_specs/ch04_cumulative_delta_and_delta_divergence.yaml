spec_id: ch04_cumulative_delta_and_delta_divergence
concept_id: ch04_cumulative_delta_and_delta_divergence
concept_name: Cumulative Delta & Delta Divergence
display_name: Cumulative Delta & Delta Divergence
glossary_ref: glossary/chapter_04_tape_reading_microstructure.md#cumulative-delta-and-delta-divergence
chapter:
  chapter_number: 4
  chapter_title: Tape Reading & Microstructure
  glossary_path: glossary/chapter_04_tape_reading_microstructure.md
determinism_class: JUDGMENT_ASSISTED
semantic_source:
  glossary_path: glossary/chapter_04_tape_reading_microstructure.md
  concept_heading: Cumulative Delta & Delta Divergence
  doctrine_summary: "**Delta** is the net of aggressive buying (trades executed at the offer) minus aggressive selling (trades\
    \ executed at the bid). **Cumulative delta** sums it across a session, producing a running tally of net initiative. **Cumulative\
    \ delta confirmation** is delta and price moving together \u2014 initiative is genuinely behind the move. **Delta divergence**\
    \ is price making a new extreme while delta does not, or the reverse \u2014 aggression and price disagree. **Cumulative\
    \ delta failure** is delta driving hard while price refuses to follow, which is absorption viewed from the delta side.\
    \ Delta is powerful but heavily abused: it measures *effort*, not..."
purpose: Emit bounded evidence and review labels for Cumulative Delta & Delta Divergence while preserving human judgment and
  refusing unsupported deterministic conclusions.
description: P16 Wave 3 detection-spec contract for Cumulative Delta & Delta Divergence. Evidence tagging and confidence/downgrade
  logic only; final trader judgment remains outside the detector.
non_executional_boundary: This spec emits semantic market-read, evidence, context, confidence, and refusal labels only. It
  never emits trade permission, entry, exit, stop, target, position sizing, add/reduce, broker, order, account, fill, P&L,
  or autonomous trading instructions.
required_inputs:
- name: bid_ask_classified_trades
  source: order_flow_module
  granularity: tick_or_footprint
  session_dependency: Aggressive buy/sell classification for delta.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: price_sequence
  source: market_data
  granularity: tick_or_intraday
  session_dependency: Price result compared with delta effort.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: structural_location
  source: structural_reference_module
  granularity: price_context
  session_dependency: Where divergence or confirmation occurs.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: tape_quality
  source: tape_quality_spec
  granularity: intraday
  purpose: Downgrades noisy/thin delta context.
  absence_behavior: DEGRADED_CONFIDENCE
- name: footprint_imbalances
  source: footprint_feed
  granularity: bar_or_price
  purpose: Improves evidence detail.
  absence_behavior: DEGRADED_CONFIDENCE
- name: profile_context
  source: profile_module
  granularity: value_or_extreme
  purpose: Grades location importance.
  absence_behavior: DEGRADED_CONFIDENCE
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: DEGRADED_CONFIDENCE
  missing_calibration_parameters: CONTEXT_ONLY
  feed_blocked_condition: REFUSE_TO_CLASSIFY
  data_quality_failure: INSUFFICIENT_EVIDENCE
refusal_behavior:
  missing_required_feed: REFUSE_TO_CLASSIFY
  missing_calibration: CONTEXT_ONLY
  conflicting_evidence: REVIEW_REQUIRED
  missing_specialized_feed: DEGRADED_CONFIDENCE
detection_scope:
  allowed_to_classify:
  - Bounded evidence states for Cumulative Delta & Delta Divergence.
  - Confidence, downgrade, context, and refusal states tied to declared feeds.
  - Structural or evidence labels only, according to the determinism class.
  not_allowed_to_classify:
  - Trade permission or any execution instruction.
  - Entry, exit, stop, target, sizing, add/reduce, broker, order, account, fill, or P&L behavior.
  - Autonomous direction, setup approval, or guaranteed signal language.
  - Delta measures effort, not outcome; delta labels must be paired with price location and never stand alone.
  instrument_scope: Single instrument unless a future spec explicitly composes multiple registry concepts.
  session_scope: Scoped by the session definitions declared in required_inputs.
  timeframe_scope: Scoped by the supplied timeframe or profile/session period.
  regime_scope: Calibration and confidence are regime-aware; no universal thresholds are permitted.
evidence_model:
  evidence_categories:
  - name: primary_structure_or_feed
    observations:
    - DELTA_CONFIRMATION
    - DELTA_DIVERGENCE
    derivation: Primary feed evidence listed in required_inputs for Cumulative Delta & Delta Divergence.
  - name: confirmation_or_context
    observations:
    - CONFIRMATION_REQUIRED
    - REVIEW_REQUIRED
    - DEGRADED_CONFIDENCE
    derivation: Optional feeds and context either strengthen, downgrade, or require manual review.
  - name: refusal_and_feed_quality
    observations:
    - INSUFFICIENT_EVIDENCE
    - REFUSE_TO_CLASSIFY
    - BLOCKED_BY_FEEDS
    derivation: Missing required feeds, missing calibration, stale data, or feed-blocked conditions.
  evidence_hierarchy: Required inputs define the narrow Cumulative Delta & Delta Divergence state. Optional inputs can improve
    confidence but cannot create executional output or substitute for missing required feeds.
  evidence_states:
    supported:
    - DELTA_CONFIRMATION
    - DELTA_DIVERGENCE
    - DELTA_FAILURE_EFFORT_WITHOUT_RESULT
    - LOCATION_REQUIRED
    unsupported:
    - Any autonomous trade call from this concept.
    - Any deterministic claim beyond the registry determinism class.
    - Any proxy classification when a required feed is missing.
rule_structure:
  type: judgment_assisted_delta_evidence_tagger
  description: Evidence tagging and confidence/downgrade logic only; final trader judgment remains outside the detector.
  states:
  - DELTA_CONFIRMATION: Bounded Cumulative Delta & Delta Divergence label emitted only when evidence supports this state.
  - DELTA_DIVERGENCE: Bounded Cumulative Delta & Delta Divergence label emitted only when evidence supports this state.
  - DELTA_FAILURE_EFFORT_WITHOUT_RESULT: Bounded Cumulative Delta & Delta Divergence label emitted only when evidence supports
      this state.
  - LOCATION_REQUIRED: Bounded Cumulative Delta & Delta Divergence label emitted only when evidence supports this state.
  - TRADE_CLASSIFICATION_REQUIRED: Bounded Cumulative Delta & Delta Divergence label emitted only when evidence supports this
      state.
  - LOW_CONFIDENCE_DELTA_CONTEXT: Bounded Cumulative Delta & Delta Divergence label emitted only when evidence supports this
      state.
  - REVIEW_REQUIRED: Bounded Cumulative Delta & Delta Divergence label emitted only when evidence supports this state.
  - INSUFFICIENT_EVIDENCE: Bounded Cumulative Delta & Delta Divergence label emitted only when evidence supports this state.
  - REFUSE_TO_CLASSIFY: Bounded Cumulative Delta & Delta Divergence label emitted only when evidence supports this state.
  rules:
  - id: R1_delta_confirmation
    logic: Emit DELTA_CONFIRMATION only when declared evidence for Cumulative Delta & Delta Divergence supports that bounded
      state and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R2_delta_divergence
    logic: Emit DELTA_DIVERGENCE only when declared evidence for Cumulative Delta & Delta Divergence supports that bounded
      state and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R3_delta_failure_effort_without_result
    logic: Emit DELTA_FAILURE_EFFORT_WITHOUT_RESULT only when declared evidence for Cumulative Delta & Delta Divergence supports
      that bounded state and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R4_location_required
    logic: Emit LOCATION_REQUIRED only when declared evidence for Cumulative Delta & Delta Divergence supports that bounded
      state and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R5_trade_classification_required
    logic: Emit TRADE_CLASSIFICATION_REQUIRED only when declared evidence for Cumulative Delta & Delta Divergence supports
      that bounded state and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R_refusal
    logic: Emit INSUFFICIENT_EVIDENCE or REFUSE_TO_CLASSIFY when required feeds, calibration, session scope, or data quality
      are missing. Do not substitute proxy data for unavailable required evidence.
  determinism_note: Cumulative Delta & Delta Divergence is classified as JUDGMENT_ASSISTED; rule behavior must stay inside
    that class and avoid false determinism.
decision_logic:
  summary: Evaluate required feeds for Cumulative Delta & Delta Divergence, apply the class-appropriate rule structure, add
    optional evidence only as confirmation or downgrade context, and refuse when the evidence is missing or outside scope.
  boundary: Delta measures effort, not outcome; delta labels must be paired with price location and never stand alone.
  missing_feed_priority: Refusal or downgrade is preferred over inferred classification.
