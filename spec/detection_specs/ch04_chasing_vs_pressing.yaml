spec_id: ch04_chasing_vs_pressing
concept_id: ch04_chasing_vs_pressing
concept_name: Chasing vs. Pressing
display_name: Chasing vs. Pressing
glossary_ref: glossary/chapter_04_tape_reading_microstructure.md#chasing-vs-pressing
chapter:
  chapter_number: 4
  chapter_title: Tape Reading & Microstructure
  glossary_path: glossary/chapter_04_tape_reading_microstructure.md
determinism_class: JUDGMENT_ASSISTED
semantic_source:
  glossary_path: glossary/chapter_04_tape_reading_microstructure.md
  concept_heading: Chasing vs. Pressing
  doctrine_summary: "This is the **aggression read** \u2014 whether the active side is genuinely committed or merely present.\
    \ \"Buyers are not chasing\" means price is offered higher but nobody is willing to lift it; \"sellers are not pressing\"\
    \ means price is bid lower but nobody hits it. The mirror image \u2014 \"aggressive buying into resistance,\" \"aggressive\
    \ selling into support\" \u2014 is initiators paying *worse* prices to get filled through a level. The question is never\
    \ simply \"is price moving\"; it is \"are aggressors willing to pay up (or down) to participate.\" A rally with nobody\
    \ chasing dies without a single down-tick of warning, because it was never demand \u2014 it was..."
purpose: Emit bounded evidence and review labels for Chasing vs. Pressing while preserving human judgment and refusing unsupported
  deterministic conclusions.
description: P16 Wave 3 detection-spec contract for Chasing vs. Pressing. Evidence tagging and confidence/downgrade logic
  only; final trader judgment remains outside the detector.
non_executional_boundary: This spec emits semantic market-read, evidence, context, confidence, and refusal labels only. It
  never emits trade permission, entry, exit, stop, target, position sizing, add/reduce, broker, order, account, fill, P&L,
  or autonomous trading instructions.
required_inputs:
- name: price_sequence
  source: market_data
  granularity: tick_or_intraday
  session_dependency: Move texture, pullbacks, and continuation path.
  absence_behavior: REFUSE_TO_CLASSIFY
- name: volume_or_trade_activity
  source: volume_feed
  granularity: intraday
  session_dependency: Participation behind movement.
  absence_behavior: REFUSE_TO_CLASSIFY
optional_inputs:
- name: cumulative_delta
  source: order_flow_module
  granularity: tick_or_intraday
  purpose: Aggressive participation quality.
  absence_behavior: DEGRADED_CONFIDENCE
- name: depth_or_spread
  source: quote_or_depth_feed
  granularity: intraday
  purpose: Thin/vacuum context.
  absence_behavior: DEGRADED_CONFIDENCE
- name: value_behavior
  source: value_area_module
  granularity: profile
  purpose: Whether value confirms the movement.
  absence_behavior: DEGRADED_CONFIDENCE
unavailable_input_behavior:
  missing_required_input: REFUSE_TO_CLASSIFY
  missing_optional_input: DEGRADED_CONFIDENCE
  missing_calibration_parameters: CONTEXT_ONLY
  feed_blocked_condition: REFUSE_TO_CLASSIFY
  data_quality_failure: INSUFFICIENT_EVIDENCE
refusal_behavior:
  missing_required_feed: REFUSE_TO_CLASSIFY
  missing_calibration: CONTEXT_ONLY
  conflicting_evidence: REVIEW_REQUIRED
  missing_specialized_feed: DEGRADED_CONFIDENCE
detection_scope:
  allowed_to_classify:
  - Bounded evidence states for Chasing vs. Pressing.
  - Confidence, downgrade, context, and refusal states tied to declared feeds.
  - Structural or evidence labels only, according to the determinism class.
  not_allowed_to_classify:
  - Trade permission or any execution instruction.
  - Entry, exit, stop, target, sizing, add/reduce, broker, order, account, fill, or P&L behavior.
  - Autonomous direction, setup approval, or guaranteed signal language.
  - Chase/pressing labels describe participant behavior quality and never direction or permission.
  instrument_scope: Single instrument unless a future spec explicitly composes multiple registry concepts.
  session_scope: Scoped by the session definitions declared in required_inputs.
  timeframe_scope: Scoped by the supplied timeframe or profile/session period.
  regime_scope: Calibration and confidence are regime-aware; no universal thresholds are permitted.
evidence_model:
  evidence_categories:
  - name: primary_structure_or_feed
    observations:
    - CHASE_EVIDENCE_PRESENT
    - PRESSING_EVIDENCE_PRESENT
    derivation: Primary feed evidence listed in required_inputs for Chasing vs. Pressing.
  - name: confirmation_or_context
    observations:
    - CONFIRMATION_REQUIRED
    - REVIEW_REQUIRED
    - DEGRADED_CONFIDENCE
    derivation: Optional feeds and context either strengthen, downgrade, or require manual review.
  - name: refusal_and_feed_quality
    observations:
    - INSUFFICIENT_EVIDENCE
    - REFUSE_TO_CLASSIFY
    - BLOCKED_BY_FEEDS
    derivation: Missing required feeds, missing calibration, stale data, or feed-blocked conditions.
  evidence_hierarchy: Required inputs define the narrow Chasing vs. Pressing state. Optional inputs can improve confidence
    but cannot create executional output or substitute for missing required feeds.
  evidence_states:
    supported:
    - CHASE_EVIDENCE_PRESENT
    - PRESSING_EVIDENCE_PRESENT
    - VACUUM_OR_THIN_TRAVEL_RISK
    - PARTICIPATION_QUALITY_REVIEW
    unsupported:
    - Any autonomous trade call from this concept.
    - Any deterministic claim beyond the registry determinism class.
    - Any proxy classification when a required feed is missing.
rule_structure:
  type: judgment_assisted_participation_quality_tagger
  description: Evidence tagging and confidence/downgrade logic only; final trader judgment remains outside the detector.
  states:
  - CHASE_EVIDENCE_PRESENT: Bounded Chasing vs. Pressing label emitted only when evidence supports this state.
  - PRESSING_EVIDENCE_PRESENT: Bounded Chasing vs. Pressing label emitted only when evidence supports this state.
  - VACUUM_OR_THIN_TRAVEL_RISK: Bounded Chasing vs. Pressing label emitted only when evidence supports this state.
  - PARTICIPATION_QUALITY_REVIEW: Bounded Chasing vs. Pressing label emitted only when evidence supports this state.
  - STRUCTURAL_CONTEXT_ONLY: Bounded Chasing vs. Pressing label emitted only when evidence supports this state.
  - DEGRADED_CONFIDENCE: Bounded Chasing vs. Pressing label emitted only when evidence supports this state.
  - INSUFFICIENT_EVIDENCE: Bounded Chasing vs. Pressing label emitted only when evidence supports this state.
  - REFUSE_TO_CLASSIFY: Bounded Chasing vs. Pressing label emitted only when evidence supports this state.
  rules:
  - id: R1_chase_evidence_present
    logic: Emit CHASE_EVIDENCE_PRESENT only when declared evidence for Chasing vs. Pressing supports that bounded state and
      required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R2_pressing_evidence_present
    logic: Emit PRESSING_EVIDENCE_PRESENT only when declared evidence for Chasing vs. Pressing supports that bounded state
      and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R3_vacuum_or_thin_travel_risk
    logic: Emit VACUUM_OR_THIN_TRAVEL_RISK only when declared evidence for Chasing vs. Pressing supports that bounded state
      and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R4_participation_quality_review
    logic: Emit PARTICIPATION_QUALITY_REVIEW only when declared evidence for Chasing vs. Pressing supports that bounded state
      and required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R5_structural_context_only
    logic: Emit STRUCTURAL_CONTEXT_ONLY only when declared evidence for Chasing vs. Pressing supports that bounded state and
      required feeds are present; otherwise prefer confirmation, review, downgrade, or refusal labels.
  - id: R_refusal
    logic: Emit INSUFFICIENT_EVIDENCE or REFUSE_TO_CLASSIFY when required feeds, calibration, session scope, or data quality
      are missing. Do not substitute proxy data for unavailable required evidence.
  determinism_note: Chasing vs. Pressing is classified as JUDGMENT_ASSISTED; rule behavior must stay inside that class and
    avoid false determinism.
decision_logic:
  summary: Evaluate required feeds for Chasing vs. Pressing, apply the class-appropriate rule structure, add optional evidence
    only as confirmation or downgrade context, and refuse when the evidence is missing or outside scope.
  boundary: Chase/pressing labels describe participant behavior quality and never direction or permission.
  missing_feed_priority: Refusal or downgrade is preferred over inferred classification.
calibration_parameters:
- name: chase_activity_requirement
  value: null
  status: calibration_required
  unit: configured
  calibration_scope: instrument_session_timeframe_regime
  description: chase_activity_requirement parameter; value must be supplied by later calibration or method configuration,
    not P16.
- name: pressing_persistence_requirement
  value: null
  status: calibration_required
  unit: configured
  calibration_scope: instrument_session_timeframe_regime
  description: pressing_persistence_requirement parameter; value must be supplied by later calibration or method configuration,
    not P16.
- name: vacuum_risk_policy
  value: null
  status: calibration_required
  unit: configured
  calibration_scope: instrument_session_timeframe_regime
  description: vacuum_risk_policy parameter; value must be supplied by later calibration or method configuration, not P16.
parameters:
- name: chase_activity_requirement
  value: null
  status: calibration_required
- name: pressing_persistence_requirement
  value: null
  status: calibration_required
- name: vacuum_risk_policy
  value: null
  status: calibration_required
confidence_behavior:
  full_confidence: All required feeds present, data quality clean, calibration available where needed, and primary evidence
    agrees with optional confirmation.
  degraded_confidence_triggers:
  - Optional confirmation feeds are missing.
  - Data quality is usable but incomplete.
  - Adjacent but not exact session/regime context is being used for review only.
  review_required_trigger: Primary evidence and optional confirmation disagree, or the result would require discretionary
    interpretation beyond the spec.
  no_binary_certainty_claim: Outputs are bounded evidence states, not certainty claims or trading instructions.
confidence_rules:
  full_confidence_requires:
  - Required inputs present
  - Clean session/timeframe scope
  - No material evidence conflict
  downgrade_when:
  - Optional feeds absent
  - Specialized feeds absent
  - Calibration absent where required
  - Regime or session mismatch
  refuse_when:
  - Required feeds absent
  - Data unreadable
  - Scope cannot be established
refusal_conditions:
- Required feed missing or stale.
- Session, profile, or timeframe boundary cannot be established.
- Calibration is required but unavailable.
- Evidence would require guessing participant intent, execution behavior, or unavailable feed state.
- Data quality is insufficient for the declared determinism class.
output_labels: &id001
- CHASE_EVIDENCE_PRESENT
- PRESSING_EVIDENCE_PRESENT
- VACUUM_OR_THIN_TRAVEL_RISK
- PARTICIPATION_QUALITY_REVIEW
- STRUCTURAL_CONTEXT_ONLY
- DEGRADED_CONFIDENCE
- INSUFFICIENT_EVIDENCE
- REFUSE_TO_CLASSIFY
- CONTEXT_ONLY
- CONFIRMATION_REQUIRED
- REVIEW_REQUIRED
states_emitted: *id001
allowed_action_labels: *id001
false_positive_risks:
- Overclassifying Chasing vs. Pressing from a single weak observation.
- Treating optional confirmation as if it were required evidence.
- Using stale or wrong-session references.
- Applying calibration outside its instrument/session/timeframe/regime scope.
false_negative_risks:
- Withholding a valid Chasing vs. Pressing state because optional feeds are missing.
- Missing the state because data arrives late or session boundaries are wrong.
- Overly strict future calibration suppresses legitimate evidence.
- Downgrading a structurally valid state because interpretation context is unavailable.
failure_modes:
- Feed outage or stale data.
- Bad session calendar, profile period, or timeframe definition.
- Contract roll or data stitching artifact.
- Regime mismatch or missing calibration.
- Event-window distortion or low-liquidity condition requiring downgrade or review.
validation_requirements:
- Replay labeled Chasing vs. Pressing examples and confirm only bounded states are emitted.
- Confirm missing required feeds produce refusal or insufficient-evidence behavior.
- Confirm missing optional feeds degrade confidence without proxy substitution.
- Confirm no output label implies trade permission, entries, exits, stops, targets, sizing, or broker/order behavior.
- Confirm calibrated parameters remain null until later calibration artifacts supply scoped values.
test_cases:
- name: required_feeds_present_supported_state
  expected: CHASE_EVIDENCE_PRESENT
- name: missing_required_feed
  expected: REFUSE_TO_CLASSIFY
- name: missing_optional_confirmation
  expected: DEGRADED_CONFIDENCE
- name: conflicting_evidence
  expected: REVIEW_REQUIRED
- name: missing_calibration_when_required
  expected: CONTEXT_ONLY
