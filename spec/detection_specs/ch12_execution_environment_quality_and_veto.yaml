  - LIQUIDITY_DEPTH_BLOCKED
  - VOLATILITY_ENVIRONMENT_BLOCKED
  - EVENT_RISK_BLOCKED
  - FEED_HEALTH_BLOCKED
  - NO_CLEAN_EXPRESSION_CONTEXT
  - INSUFFICIENT_EVIDENCE
  not_allowed_to_classify:
