    - autonomous_classification_beyond_registry_class
rule_structure:
  type: calibrated_evidence_state_machine
  description: P19-hardened state logic with concept-specific labels, class-preserving refusal behavior, and no
    universal thresholds or executional output.
  rules:
  - id: R1_acceptable_context
    logic: Emit ENVIRONMENT_QUALITY_ACCEPTABLE_CONTEXT when calibrated spread, depth, volatility, tape speed, event,
      and feed-health inputs are inside acceptable monitoring bounds.
  - id: R2_spread_depth
    logic: Emit SPREAD_QUALITY_BLOCKED or LIQUIDITY_DEPTH_BLOCKED when spread or depth evidence blocks clean expression
      quality.
  - id: R3_volatility
    logic: Emit VOLATILITY_ENVIRONMENT_BLOCKED when realized volatility, snap-back behavior, or range instability
      makes confirmation/invalidation unreliable.
  - id: R4_event
    logic: Emit EVENT_RISK_BLOCKED when scheduled or active catalyst windows distort first reaction or liquidity
      quality.
  - id: R5_feed_health
    logic: Emit FEED_HEALTH_BLOCKED or INSUFFICIENT_EVIDENCE when required environment feeds are missing, stale,
      or partial.
  determinism_note: Registry and matrix class is CALIBRATED. Later work must not promote this spec beyond that class
    without governance review.
decision_logic:
  summary: P19-hardened evaluation for Execution Environment Quality & Veto using concept-specific states, feed-explicit
    evidence, class-preserving calibration/refusal behavior, and non-executional outputs.
  steps:
  - Validate spread, depth, realized volatility, range expansion, session window, event calendar, tape speed, and
    feed health.
  - Classify environment quality by the specific blocking layer rather than a generic veto.
  - Downgrade to insufficient evidence when the feed needed for a blocking layer is unavailable.
  - Keep veto labels as semantic expression-quality states; they do not place, cancel, resize, or manage orders.
  - Emit no directional, entry, exit, stop, target, sizing, broker, account, fill, or P&L behavior.
  output_boundary: Outputs are read-quality, evidence, context, confidence, review, or refusal labels only.
