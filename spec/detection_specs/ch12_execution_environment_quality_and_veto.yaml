false_positive_risks:
- Treating strong thesis quality as overriding environment veto.
- Inferring spread/depth condition from bars alone.
- Confusing volatility opportunity with volatility block.
- Allowing veto labels to become order-management behavior.
- Treating calibrated evidence as deterministic truth rather than calibrated state support.
false_negative_risks:
- Over-refusing when core structural evidence is present but optional feeds are absent.
- Missing a valid weaker state because calibrated confirmation is unavailable.
- Treating missing calibration as proof that the concept is absent.
failure_modes:
- Treating strong thesis quality as overriding environment veto.
- Inferring spread/depth condition from bars alone.
- Confusing volatility opportunity with volatility block.
- Allowing veto labels to become order-management behavior.
validation_requirements:
- YAML parses as a mapping and includes all schema-required fields.
- concept_id exists in spec/concept_registry.yaml and determinism_class matches registry and matrix.
- Replay cases cover supported, unsupported, degraded-confidence, missing-required-feed, missing-optional-feed,
  and executional-output-request paths.
- No numeric thresholds or calibration values are introduced in the spec.
- Human review confirms the output remains actionable in judgment and non-executional in instruction.
test_cases:
- name: spread_block_path
  given: Spread evidence violates calibrated clean-expression condition.
  expect: SPREAD_QUALITY_BLOCKED
- name: event_block_path
  given: Market is inside a scheduled event window with unstable first reaction.
  expect: EVENT_RISK_BLOCKED
- name: missing_depth_path
  given: Price and volatility feeds exist but depth feed is unavailable.
  expect: INSUFFICIENT_EVIDENCE or narrower non-depth environment label
- name: missing_required_feed_path
  given: A required feed or context input is missing, stale, malformed, or out of scope.
  expect: REFUSE_TO_CLASSIFY
- name: missing_optional_feed_downgrade_path
  given: Required evidence is present but optional confirmation evidence is unavailable.
  expect: DEGRADED_CONFIDENCE
- name: executional_output_guard
  given: Caller requests trade permission, entry, exit, stop, target, sizing, broker/order/account/fill/P&L behavior,
    or autonomous action.
  expect: REFUSE_TO_CLASSIFY
